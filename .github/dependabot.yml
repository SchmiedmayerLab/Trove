version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/documentation"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "swift"
    directory: "/TroveAPI"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "swift"
    directory: "/TroveServer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/TroveWeb"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # grove-design-system's DataTable is built on react-table 8; remove once it supports 9 (#182).
      - dependency-name: "@tanstack/react-table"
        versions: [">=9"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/TroveInfrastructure/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/TroveInfrastructure/validator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # botocore requires python-dateutil<3.0.0; remove once botocore allows a newer major version (#182).
      - dependency-name: "python-dateutil"
        versions: [">=3"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/TroveServer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/TroveWeb"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker-compose"
    directory: "/TroveInfrastructure/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "terraform"
    directory: "/TroveInfrastructure/terraform"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
