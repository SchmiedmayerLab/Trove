version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/documentation"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "swift"
    directory: "/TroveAPI"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "swift"
    directory: "/TroveServer"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/TroveWeb"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/TroveInfrastructure/tools"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/TroveInfrastructure/validator"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/TroveServer"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/TroveWeb"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker-compose"
    directory: "/TroveInfrastructure/docker"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "terraform"
    directory: "/TroveInfrastructure/terraform"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
