name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: blacksmith
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --package-path api
      - name: Test
        run: swift test --package-path api
