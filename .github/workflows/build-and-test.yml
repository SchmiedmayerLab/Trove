name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual and weekly runs exercise every Trove component independently of
      # changed-file selection. Pull requests and pushes keep their affected scope.
      api: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.api }}
      server: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.server }}
      web: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}
      ios: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios }}
      ios_ui: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios_ui }}
      infrastructure: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.infrastructure }}
      devstack: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.devstack }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - "TroveAPI/**"
              - ".github/workflows/swift-package.yml"
              - ".github/workflows/build-and-test.yml"
              - "scripts/**"
            server:
              - "TroveInfrastructure/validator/**"
              - "TroveServer/**"
              - "TroveAPI/**"
              - ".dockerignore"
              - ".github/workflows/swift-package.yml"
              - ".github/workflows/build-and-test.yml"
              - "scripts/**"
            web:
              - "TroveWeb/**"
              - "TroveAPI/openapi.yaml"
              - ".dockerignore"
              - "TroveInfrastructure/tools/verify_web_image.py"
              - "TroveInfrastructure/tools/requirements.txt"
              - ".github/workflows/web.yml"
              - ".github/actions/setup-trivy/**"
              - ".github/workflows/build-and-test.yml"
              - "scripts/**"
            ios:
              - "TroveiOS/**"
              - "TroveAPI/**"
              - "scripts/native-line-coverage.py"
              - ".github/workflows/build-and-test.yml"
            ios_ui:
              - "TroveiOS/**"
              - "TroveAPI/**"
              - "TroveServer/**"
              - "scripts/native-line-coverage.py"
              - "TroveInfrastructure/docker/keycloak/realm.json"
              - "TroveInfrastructure/validator/manifest.json"
              - ".github/workflows/build-and-test.yml"
            infrastructure:
              - "TroveInfrastructure/**"
              - ".github/workflows/infrastructure.yml"
              - ".github/workflows/build-and-test.yml"
            devstack:
              - ".github/workflows/dev-stack.yml"
              - ".github/workflows/publish-images.yml"
              - ".github/actions/setup-trivy/**"

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/swift-package.yml
    permissions:
      contents: read
    with:
      path: TroveAPI
      artifact-name: Trove-API-Tests.lcov

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/swift-package.yml
    permissions:
      contents: read
    with:
      path: TroveServer
      artifact-name: Trove-Server-Tests.lcov

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild.yml@v0.5
    permissions:
      contents: read
    with:
      path: TroveiOS
      runsonlabels: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "macOS"]' }}
      # Bind the runtime: OS:latest can select an installed runtime without this device.
      destination: 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0'
      # The real-stack job owns UI testing and its service/simulator prerequisites.
      scheme: Trove-UnitTests
      resultBundle: Trove-iOS-Tests.xcresult
      artifactname: Trove-iOS-Tests.xcresult

  ios-ui:
    name: iOS Real Stack UI
    needs: changes
    if: needs.changes.outputs.ios_ui == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "macOS"]') }}
    concurrency:
      group: trove-ios-real-stack
      queue: max
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install the native test stack
        shell: bash
        env:
          KEYCLOAK_VERSION: 26.8.0
          KEYCLOAK_SHA256: 9e41da899f838a58cd510fc98ed4f7cadc715aed5683e42aca20a0c9a2a3980a
        run: |
          if ! brew list --versions openjdk@21 >/dev/null; then
            brew install openjdk@21
          fi
          archive="$RUNNER_TEMP/keycloak-$KEYCLOAK_VERSION.tar.gz"
          installation_root="$RUNNER_TEMP/trove-keycloak-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location --retry 3 \
            "https://github.com/keycloak/keycloak/releases/download/$KEYCLOAK_VERSION/keycloak-$KEYCLOAK_VERSION.tar.gz" \
            --output "$archive"
          echo "$KEYCLOAK_SHA256  $archive" | shasum --algorithm 256 --check
          mkdir -p "$installation_root"
          tar --extract --gzip --file "$archive" --directory "$installation_root"
          echo "JAVA_HOME=$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"
          echo "KEYCLOAK_HOME=$installation_root/keycloak-$KEYCLOAK_VERSION" >> "$GITHUB_ENV"
      - name: Start the native test stack
        run: |
          chmod +x TroveiOS/scripts/start-ui-test-stack.sh
          TroveiOS/scripts/start-ui-test-stack.sh
      - name: Seed the UI-test study and participant
        run: |
          dev_password="$(jq -r '.users[] | select(.username == "alice@example.com") | .credentials[] | select(.type == "password") | .value' TroveInfrastructure/docker/keycloak/realm.json)"
          KEYCLOAK_DEV_PASSWORD="$dev_password" TroveiOS/scripts/seed-ui-test.sh
      - name: Resolve iOS dependencies
        working-directory: TroveiOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Trove.xcodeproj \
            -scheme Trove \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath .derivedData \
          | xcbeautify
      - name: Prepare an isolated UI-test simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create "Trove-UI-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          # Record ownership before boot so cleanup also runs after preparation failure.
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run the real-stack UI test
        working-directory: TroveiOS
        env:
          TROVE_UI_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Trove.xcodeproj \
            -scheme Trove \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=iOS Simulator,id=$TROVE_UI_SIMULATOR" \
            -only-testing:TroveUITests/TroveUITests/testParticipantCanSignInEnrollAndWithdraw \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -derivedDataPath .derivedData \
            -resultBundlePath Trove-iOS-UI-Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
          2>&1 | tee "$RUNNER_TEMP/trove-ui-xcodebuild.log" | xcbeautify
          xcrun xcresulttool get test-results summary --path Trove-iOS-UI-Tests.xcresult \
            | jq --exit-status '
                .result == "Passed" and .totalTestCount == 1 and .passedTests == 1
                and .failedTests == 0 and .skippedTests == 0 and .expectedFailures == 0'
      - name: Verify the consent receipts and retained PDFs
        run: |
          dev_password="$(jq -r '.users[] | select(.username == "alice@example.com") | .credentials[] | select(.type == "password") | .value' TroveInfrastructure/docker/keycloak/realm.json)"
          KEYCLOAK_DEV_PASSWORD="$dev_password" TROVE_UI_CONSENT_RESULT_DIR="$RUNNER_TEMP/trove-ui-consent" \
            bash TroveiOS/scripts/verify-ui-test-consent.sh
      - name: Upload the UI-test result
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-iOS-UI-Tests.xcresult
          path: TroveiOS/Trove-iOS-UI-Tests.xcresult
          if-no-files-found: warn
      - name: Upload the raw UI-test log
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-iOS-UI-Test-Log
          path: ${{ runner.temp }}/trove-ui-xcodebuild.log
          if-no-files-found: warn
      - name: Collect stack diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/trove-ui-test-stack/*.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              tail -n 200 "$log"
            fi
          done
      - name: Remove the job's UI-test simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          TROVE_UI_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$TROVE_UI_SIMULATOR" || true
          xcrun simctl delete "$TROVE_UI_SIMULATOR"
      - name: Tear down the native test stack
        if: always()
        run: |
          chmod +x TroveiOS/scripts/stop-ui-test-stack.sh
          TroveiOS/scripts/stop-ui-test-stack.sh

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read

  infrastructure:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    uses: ./.github/workflows/infrastructure.yml
    permissions:
      contents: read

  dev-stack:
    name: Dev Stack
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.devstack == 'true'
    uses: ./.github/workflows/dev-stack.yml
    permissions:
      contents: read

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  vulnerability-scan:
    name: Vulnerability Scan
    uses: ./.github/workflows/vulnerability-scan.yml
    permissions:
      contents: read

  verification:
    name: Required Verification
    needs: [changes, api, server, ios, ios-ui, web, infrastructure, dev-stack, native-line-coverage, coverage, secret-scan, vulnerability-scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected verification job to succeed
        shell: bash
        env:
          TROVE_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$TROVE_CI_NEEDS" | python3 scripts/check-ci-results.py

  publish-images:
    name: Publish Verified Images
    needs: [verification, dev-stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-images.yml
    permissions:
      actions: read
      contents: read
      packages: write

  native-line-coverage:
    name: Native Line Coverage
    needs: [ios, ios-ui]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.ios.result == 'success' || needs.ios-ui.result == 'success')
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "macOS"]') }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      NATIVE_COVERAGE_SUBDIRECTORY: native-coverage-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download native unit-test coverage
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: Trove-iOS-Tests.xcresult
          path: ${{ runner.temp }}/${{ env.NATIVE_COVERAGE_SUBDIRECTORY }}/unit.xcresult
      - name: Download native UI-test coverage
        if: needs.ios-ui.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: Trove-iOS-UI-Tests.xcresult
          path: ${{ runner.temp }}/${{ env.NATIVE_COVERAGE_SUBDIRECTORY }}/ui.xcresult
      - name: Export measured app source-line coverage
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.ios.result }}
          UI_RESULT: ${{ needs.ios-ui.result }}
        run: |
          set -euo pipefail
          bundles=()
          if [[ "$UNIT_RESULT" == success ]]; then bundles+=("$RUNNER_TEMP/$NATIVE_COVERAGE_SUBDIRECTORY/unit.xcresult"); fi
          if [[ "$UI_RESULT" == success ]]; then bundles+=("$RUNNER_TEMP/$NATIVE_COVERAGE_SUBDIRECTORY/ui.xcresult"); fi
          python3 -B scripts/native-line-coverage.py --repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/Trove-iOS-Line-Tests.lcov" "${bundles[@]}"
      - name: Upload native line coverage
        uses: actions/upload-artifact@v7
        with:
          name: Trove-iOS-Line-Tests.lcov
          path: ${{ runner.temp }}/Trove-iOS-Line-Tests.lcov
          if-no-files-found: error

  coverage:
    name: Upload Coverage Report
    needs: [api, server, ios, ios-ui, native-line-coverage, web, dev-stack]
    # Path filtering can skip every component, and the shared workflow fails when it finds
    # no reports, so only collect once at least one of them has produced something.
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') && (
        needs.api.result == 'success' ||
        needs.server.result == 'success' ||
        needs.ios.result == 'success' ||
        needs.ios-ui.result == 'success' ||
        needs.web.result == 'success' ||
        needs.dev-stack.result == 'success'
      )
    uses: SchmiedmayerLab/.github/.github/workflows/coverage.yml@v0.5
    permissions:
      actions: read
      contents: read
    with:
      # The shared collector requires a macOS toolchain even for LCOV-only inputs.
      runs_on_labels: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "macOS"]' }}
      xcodeversion: latest-stable
      # The shared Swift jobs name the report after the artifact, while the local web jobs
      # upload their native lcov.info files inside named artifact directories.
      coveragereports_lcov: >-
        ${{ needs.api.result == 'success' && 'Trove-API-Tests.lcov' || '' }}
        ${{ needs.server.result == 'success' && 'Trove-Server-Tests.lcov' || '' }}
        ${{ needs.native-line-coverage.result == 'success' && 'Trove-iOS-Line-Tests.lcov' || '' }}
        ${{ needs.web.result == 'success' && 'Trove-Web-Tests.lcov/lcov.info' || '' }}
        ${{ needs.dev-stack.result == 'success' && 'Trove-Web-E2E.lcov/lcov.info' || '' }}
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
