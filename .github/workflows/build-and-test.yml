name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      devstack: ${{ steps.filter.outputs.devstack }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - "TroveAPI/**"
              - ".github/workflows/swift-package.yml"
              - ".github/workflows/build-and-test.yml"
            server:
              - "TroveServer/**"
              - "TroveAPI/**"
              - ".github/workflows/swift-package.yml"
              - ".github/workflows/build-and-test.yml"
            web:
              - "TroveWeb/**"
              - "TroveAPI/openapi.yaml"
              - ".github/workflows/web.yml"
              - ".github/workflows/build-and-test.yml"
            ios:
              - "TroveiOS/**"
              - "TroveAPI/**"
              - ".github/workflows/build-and-test.yml"
            infrastructure:
              - "TroveInfrastructure/**"
              - ".github/workflows/infrastructure.yml"
              - ".github/workflows/build-and-test.yml"
            devstack:
              - ".github/workflows/dev-stack.yml"

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/swift-package.yml
    permissions:
      contents: read
    with:
      path: TroveAPI
      artifact-name: Trove-API-Tests.lcov

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/swift-package.yml
    permissions:
      contents: read
    with:
      path: TroveServer
      artifact-name: Trove-Server-Tests.lcov
      # The integration suites share one in-memory database per suite.
      test-flags: --no-parallel

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild.yml@v0.5
    permissions:
      contents: read
    with:
      path: TroveiOS
      runsonlabels: '["self-hosted", "macOS"]'
      scheme: Trove
      resultBundle: Trove-iOS-Tests.xcresult
      artifactname: Trove-iOS-Tests.xcresult

  ios-ui:
    name: iOS Real Stack UI
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: [self-hosted, macOS]
    concurrency: trove-ios-real-stack
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Provide a container runtime
        shell: bash
        run: |
          if ! command -v docker >/dev/null || ! docker compose version >/dev/null 2>&1; then
            brew install colima docker docker-compose
          fi
          if ! docker info >/dev/null 2>&1; then
            colima start --cpu 4 --memory 8 --disk 30
            echo "TROVE_COLIMA_STARTED=true" >> "$GITHUB_ENV"
          fi
          docker version
          docker compose version
      - name: Build the server image
        run: docker build -f TroveServer/Dockerfile -t ghcr.io/schmiedmayerlab/trove-server:main .
      - name: Start the development stack
        working-directory: TroveInfrastructure/docker
        run: |
          cp .env.example .env
          docker compose --profile migrate run --rm server-migrate
          docker compose up -d server
      - name: Seed the UI-test study and participant
        run: |
          dev_password="$(jq -r '.users[] | select(.username == "alice@example.com") | .credentials[] | select(.type == "password") | .value' TroveInfrastructure/docker/keycloak/realm.json)"
          KEYCLOAK_DEV_PASSWORD="$dev_password" TroveiOS/scripts/seed-ui-test.sh
      - name: Resolve iOS dependencies
        working-directory: TroveiOS
        run: >-
          xcodebuild -project Trove.xcodeproj -scheme Trove
          -resolvePackageDependencies -derivedDataPath .derivedData
      - name: Run the real-stack UI test
        working-directory: TroveiOS
        run: |
          simulator_os="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcodebuild test \
            -project Trove.xcodeproj \
            -scheme Trove \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=$simulator_os" \
            -only-testing:TroveUITests/TroveUITests/testParticipantCanSignInEnrollAndWithdraw \
            -parallel-testing-enabled NO \
            -derivedDataPath .derivedData \
            -resultBundlePath Trove-iOS-UI-Tests.xcresult \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation
      - name: Upload the UI-test result
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-iOS-UI-Tests.xcresult
          path: TroveiOS/Trove-iOS-UI-Tests.xcresult
          if-no-files-found: warn
      - name: Collect stack diagnostics
        if: failure()
        working-directory: TroveInfrastructure/docker
        run: |
          docker compose ps
          docker compose logs --tail 150
      - name: Tear down the development stack
        if: always()
        working-directory: TroveInfrastructure/docker
        run: |
          docker compose down -v
          if [[ "${TROVE_COLIMA_STARTED:-false}" == "true" ]]; then
            colima stop
          fi

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read

  infrastructure:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    uses: ./.github/workflows/infrastructure.yml
    permissions:
      contents: read

  dev-stack:
    name: Dev Stack
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.devstack == 'true'
    uses: ./.github/workflows/dev-stack.yml
    permissions:
      contents: read

  publish-server:
    name: Publish Server Image
    needs: server
    if: github.event_name == 'push'
    # Built from the repository root so the inlined TroveAPI package is in the build context.
    uses: SchmiedmayerLab/.github/.github/workflows/docker-build-and-push.yml@v0.5
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      imageName: schmiedmayerlab/trove-server
      dockerFile: TroveServer/Dockerfile
      workingDirectory: .
      runs_on_labels_amd64: '["blacksmith-4vcpu-ubuntu-2404"]'
      runs_on_labels_arm64: '["blacksmith-4vcpu-ubuntu-2404-arm"]'
    secrets: inherit

  publish-web:
    name: Publish Web Image
    needs: web
    if: github.event_name == 'push'
    uses: SchmiedmayerLab/.github/.github/workflows/docker-build-and-push.yml@v0.5
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      imageName: schmiedmayerlab/trove-web
      dockerFile: TroveWeb/Dockerfile
      workingDirectory: .
      runs_on_labels_amd64: '["blacksmith-4vcpu-ubuntu-2404"]'
      runs_on_labels_arm64: '["blacksmith-4vcpu-ubuntu-2404-arm"]'
    secrets: inherit

  coverage:
    name: Upload Coverage Report
    needs: [api, server, ios, ios-ui, web, dev-stack]
    # Path filtering can skip every component, and the shared workflow fails when it finds
    # no reports, so only collect once at least one of them has produced something.
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') && (
        needs.api.result == 'success' ||
        needs.server.result == 'success' ||
        needs.ios.result == 'success' ||
        needs.ios-ui.result == 'success' ||
        needs.web.result == 'success' ||
        needs.dev-stack.result == 'success'
      )
    uses: SchmiedmayerLab/.github/.github/workflows/coverage.yml@v0.5
    permissions:
      actions: read
      contents: read
    with:
      # Merging xcresult bundles needs macOS.
      runs_on_labels: '["self-hosted", "macOS"]'
      xcodeversion: latest-stable
      coveragereports: ${{ needs.ios.result == 'success' && 'Trove-*.xcresult' || '' }}
      # The shared Swift jobs name the report after the artifact, while the local web jobs
      # upload their native lcov.info files inside named artifact directories.
      coveragereports_lcov: >-
        ${{ needs.api.result == 'success' && 'Trove-API-Tests.lcov' || '' }}
        ${{ needs.server.result == 'success' && 'Trove-Server-Tests.lcov' || '' }}
        ${{ needs.web.result == 'success' && 'Trove-Web-Tests.lcov/lcov.info' || '' }}
        ${{ needs.dev-stack.result == 'success' && 'Trove-Web-E2E.lcov/lcov.info' || '' }}
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
