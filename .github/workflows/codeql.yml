name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  # Code scanning needs Advanced Security, which a private repository only has with GHAS.
  # Checking at run time means the scan starts working on its own once that changes.
  availability:
    name: Check Code Scanning Availability
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether code scanning is available
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository=$(gh api "repos/$GITHUB_REPOSITORY")
          private=$(echo "$repository" | jq -r '.private')
          # security_and_analysis is only returned to admins, so treat a missing value as off.
          advanced=$(echo "$repository" | jq -r '.security_and_analysis.advanced_security.status // "unknown"')

          if [ "$private" = "false" ] || [ "$advanced" = "enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code scanning is available (private=$private, advanced security=$advanced)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping code scanning: the repository is private and Advanced Security is not enabled."
          fi

  analyze:
    name: Analyze (JavaScript/TypeScript)
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
