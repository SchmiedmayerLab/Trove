name: Dev Stack

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Docker Compose Smoke Test (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A cold hosted release build takes about 40 minutes before service and browser checks.
    timeout-minutes: 90
    env:
      COMPOSE_FILE: docker-compose.yml:../validator/compose.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare hosted runner disk capacity
        run: bash scripts/prepare-hosted-disk.sh
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Restore pinned public validator artifacts
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/validator-artifacts
          key: fhir-validator-artifacts-v1-${{ hashFiles('TroveInfrastructure/validator/manifest.json') }}
      - name: Fetch and verify pinned validator artifacts
        # Verify cache hits too, and detect upstream outages before expensive image builds.
        run: python3 TroveInfrastructure/validator/fetch.py --output "$RUNNER_TEMP/validator-artifacts"
      # The compose file runs the published images. Building them here from the same
      # Dockerfiles the deployment uses keeps the local stack and production in step,
      # and means this job fails if either Dockerfile breaks.
      - name: Build the server and web images
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --provenance=mode=max --sbom=true --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f TroveServer/Dockerfile -t ghcr.io/schmiedmayerlab/trove-server:main .
          # Release the much larger Swift build before npm needs its own cache.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            docker builder prune --all --force
          fi
          docker build --provenance=mode=max --sbom=true --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f TroveWeb/Dockerfile -t ghcr.io/schmiedmayerlab/trove-web:main .
      - uses: ./.github/actions/setup-trivy
      - name: Scan the application images used by this stack
        run: |
          set -euo pipefail
          result=0
          for component in server web; do
            bash scripts/check vulnerabilities image --image "ghcr.io/schmiedmayerlab/trove-$component:main" \
              --output "$RUNNER_TEMP/trove-image-scans/$component" --cache "$RUNNER_TEMP/trivy-cache" || result=1
          done
          exit "$result"
      - name: Retain application image scans and inventories
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Stack-Image-Scans-${{ matrix.architecture }}
          path: ${{ runner.temp }}/trove-image-scans
          if-no-files-found: error
      - name: Release build cache before pulling backing services
        if: runner.environment == 'github-hosted'
        # Runtime images remain tagged. Only build cache on this ephemeral hosted runner is removed.
        run: |
          docker builder prune --all --force
          df -h /
      - name: Prepare the pinned offline FHIR validator
        run: |
          set -euo pipefail
          manifest=TroveInfrastructure/validator/manifest.json
          source="$RUNNER_TEMP/grove-fhir"
          git init "$source"
          git -C "$source" remote add origin https://github.com/SchmiedmayerLab/grove-fhir.git
          git -C "$source" fetch --depth=1 origin "$(jq -r '.contractRevision' "$manifest")"
          python3 TroveInfrastructure/validator/prepare.py --grove-fhir "$source" \
            --artifacts "$RUNNER_TEMP/validator-artifacts" --output "$RUNNER_TEMP/validator-context"
          docker build --network=none -t trove-fhir-validator:ci "$RUNNER_TEMP/validator-context"
          echo "FHIR_VALIDATOR_IMAGE=$(docker image inspect trove-fhir-validator:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "FHIR_VALIDATOR_IDENTITY=sha256:$(sha256sum "$manifest" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      # The server syncs Keycloak groups on boot and exits if the schema is not there yet, so the
      # migration has to run first. It starts the backing services it depends on.
      - name: Apply the migrations
        working-directory: TroveInfrastructure/docker
        run: |
          cp .env.example .env
          docker compose run --rm server-migrate
      - name: Verify the Timescale schema
        working-directory: TroveInfrastructure/docker
        run: ./verify-timescale.sh
      - name: Start the stack
        working-directory: TroveInfrastructure/docker
        run: docker compose up -d
      - name: Verify the stack
        working-directory: TroveInfrastructure/docker
        run: ./smoke-test.sh
      - name: Verify Legacy Upload Retirement
        working-directory: TroveInfrastructure/docker
        run: |
          dev_password="$(jq -r '.users[] | select(.username == "alice@example.com") | .credentials[] | select(.type == "password") | .value' keycloak/realm.json)"
          KEYCLOAK_DEV_PASSWORD="$dev_password" ./verify-fhir-ingestion.sh
      # The end-to-end tests drive the real application, so they belong with the running stack
      # rather than in the web job, which has no backend to talk to.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TroveWeb/package-lock.json
      - name: Install the web dependencies
        working-directory: TroveWeb
        run: |
          cp .env.example .env
          npm ci --ignore-scripts
          npm run generate:api
      - name: Install Playwright browsers
        working-directory: TroveWeb
        run: npx playwright install --with-deps
      - name: End-to-end tests
        working-directory: TroveWeb
        env:
          KEYCLOAK_DEV_PASSWORD: password123
        run: npm run test:e2e:coverage
      - name: End-to-end tests against the built dashboard image
        working-directory: TroveWeb
        env:
          KEYCLOAK_DEV_PASSWORD: password123
          TROVE_E2E_IMAGE: "true"
        run: npm run test:e2e
      - name: Package the tested image artifacts
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          for component in server web; do
            python3 -B scripts/release-artifact.py package --component "$component" \
              --architecture "$TARGET_ARCHITECTURE" --image "ghcr.io/schmiedmayerlab/trove-$component:main" \
              --scans "$RUNNER_TEMP/trove-image-scans/$component" --output "$RUNNER_TEMP/trove-candidates/$component"
          done
      - name: Retain tested image candidates
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Candidates-${{ matrix.architecture }}
          path: ${{ runner.temp }}/trove-candidates
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload the end-to-end coverage report
        if: (success() || failure()) && matrix.architecture == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Web-E2E.lcov
          path: TroveWeb/coverage-e2e/lcov.info
          if-no-files-found: warn
      - name: Collect diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Web-E2E-diagnostics-${{ matrix.architecture }}
          path: TroveWeb/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Collect service diagnostics on failure
        if: failure()
        working-directory: TroveInfrastructure/docker
        run: |
          docker compose ps
          docker compose logs --tail 150
      - name: Tear down
        if: always()
        working-directory: TroveInfrastructure/docker
        run: docker compose down -v
