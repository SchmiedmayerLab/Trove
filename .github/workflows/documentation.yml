name: Documentation

# Pull requests and main pushes only build and check the site. Publishing a stable
# release deploys the documentation of its tag; a manual run on such a tag redeploys it.
on:
  pull_request:
    paths: ["docs/**", "documentation/**", "zensical.toml", ".github/workflows/documentation.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "documentation/**", "zensical.toml", ".github/workflows/documentation.yml"]
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: documentation-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 0 || 1 }}
      - name: Require a stable release of a commit on main
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          test "$release" = "false false"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - name: Install the locked documentation tools
        run: python -m pip install --require-hashes -r documentation/requirements.txt
      - name: Build and check the public site
        run: |
          zensical build --clean --strict
          python documentation/check_site.py
          python -m unittest discover -s documentation -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          path: site

  deploy:
    name: Publish Documentation
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: documentation-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v5
