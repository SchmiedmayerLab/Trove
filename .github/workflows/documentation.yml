name: Documentation

# Pull requests and main pushes only build and check the site. The latest stable release
# whose commit is on main deploys the documentation of its tag; a manual run on that tag
# redeploys it.
on:
  pull_request:
    paths: ["docs/**", "documentation/**", "zensical.toml", ".github/workflows/documentation.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "documentation/**", "zensical.toml", ".github/workflows/documentation.yml"]
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: documentation-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the latest stable release of a commit on main
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          test "$release" = "false false"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - name: Install the locked documentation tools
        run: python -m pip install --require-hashes -r documentation/requirements.txt
      - name: Build and check the public site
        run: |
          zensical build --clean --strict
          python documentation/check_site.py
          python -m unittest discover -s documentation -p 'test_*.py'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          path: site

  deploy:
    name: Publish Documentation
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: documentation-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checked again here so an older run that reaches deployment after a newer
      # release cannot replace the newer documentation.
      - name: Require the release to still be the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
