name: Infrastructure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate Manifests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: TroveInfrastructure
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        env:
          KUBECONFORM_RELEASE: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_RELEASE/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          sudo tar --extract --gzip --file "$archive" --directory /usr/local/bin kubeconform
      - name: Build and validate all overlays
        run: |
          python3 -m venv "$RUNNER_TEMP/manifest-tools"
          "$RUNNER_TEMP/manifest-tools/bin/pip" install --requirement tools/requirements.txt
          "$RUNNER_TEMP/manifest-tools/bin/python" tools/prepare-manifest-schemas.py "$RUNNER_TEMP/manifest-schemas"
          overlays="infrastructure/dev infrastructure/prod apps/dev apps/prod"
          overlays="$overlays bootstrap/dev bootstrap/prod argocd-apps/dev argocd-apps/prod"
          for overlay in $overlays; do
            echo "=== $overlay ==="
            kubectl kustomize "$overlay" | kubeconform \
              -strict \
              -summary \
              -output text \
              -schema-location default \
              -schema-location "$RUNNER_TEMP/manifest-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -skip CustomResourceDefinition
          done
          for manifest in argocd-apps/dev/root-app.yaml argocd-apps/prod/root-app.yaml; do
            echo "=== $manifest ==="
            kubeconform \
              -strict \
              -summary \
              -output text \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$manifest"
          done

  tofu-validate:
    name: Tofu Validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TroveInfrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - name: Check formatting
        run: tofu fmt -check -diff
      - name: Initialize
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate

  kind-smoke-test:
    name: KIND Smoke Test
    runs-on: ubuntu-24.04
    # Include the cold release build and bounded cluster bootstrap in the job budget.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: TroveInfrastructure
    steps:
      - uses: actions/checkout@v7
      - name: Install KIND
        env:
          KIND_RELEASE: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/kind"
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_RELEASE/kind-linux-amd64" \
            --output "$binary"
          printf '%s  %s\n' "$KIND_SHA256" "$binary" | sha256sum --check --strict
          sudo install -m 0755 "$binary" /usr/local/bin/kind
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Create KIND cluster
        run: kind create cluster --name trove --config tools/kind-config.yaml
      # The dev overlay runs the published images, which do not exist for an unmerged change.
      # Building them here and loading them into the cluster is what lets the apps start at all.
      - name: Build and load the application images
        working-directory: .
        run: |
          docker build -f TroveServer/Dockerfile -t ghcr.io/schmiedmayerlab/trove-server:main .
          # KIND already occupies disk space; free Swift build cache before npm starts.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            docker builder prune --all --force
          fi
          docker build -f TroveWeb/Dockerfile -t ghcr.io/schmiedmayerlab/trove-web:main .
          # Release Swift build layers before KIND exports the tagged runtime images.
          # This job uses an ephemeral GitHub-hosted runner; do not prune a shared host.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            docker builder prune --all --force
          fi
          df -h /
          kind load docker-image --name trove ghcr.io/schmiedmayerlab/trove-server:main
          kind load docker-image --name trove ghcr.io/schmiedmayerlab/trove-web:main
      - name: Bootstrap ArgoCD and applications
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: python3 tools/setup.py --revision "$GITHUB_SHA"
      - name: Wait for ArgoCD Applications
        run: bash tools/smoke-test.sh
        env:
          SMOKE_TEST_TIMEOUT: "1200"
      - name: Debug on failure
        if: failure()
        run: |
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide
          echo ""
          # get -o wide hides the comparison error, which is where the real reason lives.
          echo "=== Application Conditions ==="
          kubectl get applications -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions}{"\n"}{end}'
          echo ""
          echo "=== All Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -40
          echo ""
          echo "=== Crashing Pod Logs ==="
          for pod in $(kubectl get pods -n trove --no-headers | grep -E 'CrashLoop|Error' | awk '{print $1}'); do
            for flag in "" "--previous"; do
              echo "--- $pod $flag ---"
              kubectl logs -n trove "$pod" --all-containers $flag --tail=40 2>&1 || true
            done
          done
