name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "api/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "api/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Resolving packages validates the local `../api` SPM reference to the
      # inlined API package.
      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project ios/StudyPlatform.xcodeproj
          -scheme StudyPlatform
      - name: Build
        run: >
          xcodebuild build
          -project ios/StudyPlatform.xcodeproj
          -scheme StudyPlatform
          -destination 'generic/platform=iOS'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
