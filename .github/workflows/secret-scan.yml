name: Secret Scan

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Verify Publication Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned secret scanner
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          installation="$(mktemp -d "$RUNNER_TEMP/trove-gitleaks.XXXXXX")"
          archive="$installation/release.tar.gz"
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$installation" gitleaks
          echo "$installation" >> "$GITHUB_PATH"
      - name: Scan current files and verify the negative control
        run: bash scripts/check secrets "$RUNNER_TEMP/trove-secret-evidence"
      - name: Retain sanitized results and source identity
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Secret-Verification
          path: ${{ runner.temp }}/trove-secret-evidence
          if-no-files-found: warn
