name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    uses: SchmiedmayerLab/.github/.github/workflows/swiftlint.yml@v0.5
    permissions:
      contents: read
    with:
      runs_on_labels: '["ubuntu-24.04"]'

  # codeql.yml scans JavaScript and TypeScript; Swift needs a build to analyse,
  # so the iOS app is scanned through xcodebuild instead.
  codeql:
    name: CodeQL (Swift)
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild.yml@v0.5
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      path: TroveiOS
      job_name: Analyze Swift
      # The shared workflow only initializes CodeQL on GitHub-hosted runners.
      runsonlabels: '["xcode-27"]'
      destination: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0'
      scheme: Trove
      test: false
      codeql: true
