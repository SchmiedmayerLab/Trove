name: Web

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint & Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: TroveWeb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TroveWeb/package-lock.json
      # --ignore-scripts skips the postinstall `openapi-ts`, which we run
      # explicitly below once the inlined spec (../api/openapi.yaml) is present.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate API client
        run: npm run generate:api
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:coverage
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: Trove-Web-Tests.lcov
          path: TroveWeb/coverage/lcov.info
          if-no-files-found: warn
