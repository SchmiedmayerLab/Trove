dirs:
  - .
useGitIgnore: true
ignorePatterns:
  - pattern: '^doc:.*$'
  - pattern: '^http://localhost.*$'
  # Private organization project; verified through the authenticated Projects API.
  # The repository-scoped CI token cannot read organization projects.
  - pattern: '^https://github\.com/orgs/SchmiedmayerLab/projects/4$'
replacementPatterns:
  - pattern: '(.*)#gh-dark-mode-only'
    replacement: '$1'
  - pattern: '(.*)#gh-light-mode-only'
    replacement: '$1'
