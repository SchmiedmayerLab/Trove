version = 1

# Files that can't carry an inline SPDX header (JSON, binaries, or Xcode-managed
# project files that get rewritten) are annotated centrally here. Everything else
# uses in-file headers.
[[annotations]]
path = [
    "TroveServer/tools/bruno/**",
    "TroveAPI/Package.resolved",
    "TroveServer/Package.resolved",
    "TroveServer/Tests/TroveServerTests/Resources/HealthKitClinicalDocuments/**",
    "TroveServer/Tests/TroveServerTests/Resources/HealthKitComponentEvents/**",
    "docs/images/**/*.png",
    "documentation/requirements.txt",
    "TroveInfrastructure/tools/requirements.txt",
    "TroveInfrastructure/validator/recovery-requirements.txt",
    "TroveInfrastructure/terraform/.terraform.lock.hcl",
    "scripts/vulnerability-exceptions.json",
]
SPDX-FileCopyrightText = "2026 Schmiedmayer Lab and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Xcode-generated project files and asset catalogs.
[[annotations]]
path = [
    "TroveiOS/Trove.xcodeproj/**",
    "TroveiOS/Trove/Assets.xcassets/**",
    "TroveiOS/Trove/*.xcstrings",
]
SPDX-FileCopyrightText = "2026 Schmiedmayer Lab and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"
