            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/OperationFailure"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderLinkCompletion"
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 36
            format: uuid
  /participant/provider-connections:
    get:
      operationId: getParticipantProviderConnections
      tags:
        - Providers
      responses:
        "200":
          description: Authenticated, authorized result.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConnection"
                minItems: 0
                maxItems: 128
        default:
          $ref: "#/components/responses/OperationFailure"
  /participant/provider-connections/{connectionId}/disconnect:
    post:
      operationId: disconnectParticipantProviderConnection
      tags:
        - Providers
      responses:
        "200":
          description: Authenticated, authorized result.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/OperationFailure"
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 36
            format: uuid

components:
  parameters:
    SourceInstallationID:
      name: Trove-Source-Installation-ID
      in: header
      required: true
      description: Registered installation UUID; separate from the participant's logical source and derivation key ID.
      schema:
        type: string
        format: uuid
    SourceInstallationProof:
      name: Trove-Source-Credential
      in: header
      required: true
      description: >
        Private installation credential. Requires independently verified participant
        authentication and ownership of the named source. New writes require an active
        installation; the server rechecks under the revocation lock before committing.
        Never include this value in logs, URLs, clinical resources or exports.
      schema:
        $ref: '#/components/schemas/SourceInstallationCredential'
    DelegationId:
      name: Trove-Delegation-ID
      in: header
      description: >
        Selects a server-side grant for a registered draft-only OAuth client. It
        cannot authorize a request by itself. Interactive clients must omit it.
      schema:
        type: string
        format: uuid
    DraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        The draftRevision returned by the study read, enclosed in double quotes.
        One strong revision covers metadata, components and schedules. A stale
        revision returns 412 without changing the draft; clients must reload and
        review the conflict rather than automatically replaying an edit.
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyId:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CodeId:
      name: codeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentId:
      name: consentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    OperationFailure:
      description: Operation denied or unavailable; no protected change or disclosure was accepted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Resource state no longer matches the submitted precondition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT access token
  schemas:
    ProviderRedirect:
      type: object
      additionalProperties: false
      required:
        - id
        - uri
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        uri:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
    ProviderCollectionMeasurement:
      type: object
      additionalProperties: false
      required:
        - profile
        - displayNameEnglish
        - displayNameGerman
      properties:
        profile:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        displayNameEnglish:
          type: string
          minLength: 1
          maxLength: 512
        displayNameGerman:
          type: string
          minLength: 1
          maxLength: 512
    ProviderCollectionCapability:
      type: object
      additionalProperties: false
      required:
        - sourceTypeIdentifier
        - measurements
        - effectiveTime
      properties:
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCollectionMeasurement"
          minItems: 1
          maxItems: 32
        effectiveTime:
          type: string
          enum:
            - point
            - interval
            - point-or-interval
    ProviderRegistration:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - displayName
        - controller
        - region
        - redirects
        - capabilities
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        provider:
          type: string
          enum:
            - withings
            - oura
            - google-health-api
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        controller:
          type: string
          minLength: 1
          maxLength: 255
        region:
          type: string
          minLength: 1
          maxLength: 255
        redirects:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRedirect"
          minItems: 1
          maxItems: 8
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCollectionCapability"
          minItems: 1
          maxItems: 512
    ProviderLinkRequest:
      type: object
      additionalProperties: false
      required:
        - redirectId
      properties:
        redirectId:
          type: string
          minLength: 1
          maxLength: 64
    ProviderLinkIntent:
      type: object
      additionalProperties: false
      required:
        - id
        - authorizationUrl
        - redirectUri
        - expiresAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        authorizationUrl:
          type: string
          minLength: 1
          maxLength: 8192
          format: uri
        redirectUri:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        expiresAt:
          type: string
          format: date-time
    ProviderLinkCompletion:
      type: object
      additionalProperties: false
      required:
        - state
        - code
      properties:
        state:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]{32,128}$
        code:
          type: string
          minLength: 1
          maxLength: 4096
    ProviderConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - registrationId
        - sourceId
        - state
        - generation
        - requiresReauthorization
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        registrationId:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        sourceId:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        state:
          type: string
          enum:
            - active
            - disconnected
            - reauthorization-required
        generation:
          type: integer
          format: int64
          minimum: 1
        lastAttempt:
          type: string
          format: date-time
        lastSuccessfulFetch:
          type: string
          format: date-time
        acceptedThrough:
          type: string
          format: date-time
        requiresReauthorization:
          type: boolean
        collectionAttempt:
          $ref: '#/components/schemas/ProviderCollectionAttempt'
    ProviderCollectionAttempt:
      type: object
      additionalProperties: false
      description: Most recent collection attempt for one exact source. This is not a completeness claim for every source on the connected account.
      required: [sourceTypeIdentifier, outcome, nextAttempt]
      properties:
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
        outcome:
          type: string
          enum:
          - scheduled
          - deferred
          - accepted
          - no-current-demand
          - transient-failure
          - capacity-blocked
          - source-blocked
          - authorization-changed
        nextAttempt:
          type: string
          format: date-time

    # ── Shared ────────────────────────────────────────────────────────────

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence

    StudyDataVersions:
      type: string
      enum: [current, history]
      default: current

    StudyDataOutput:
      type: object
      additionalProperties: false
      required: [fullUrl, isCurrent, sourceProfiles]
      properties:
        fullUrl:
          type: string
          description: Address of the derived Observation inside this response record's Bundle.
        isCurrent:
          type: boolean
        sourceProfiles:
          type: array
          description: Original profile names retained as lineage, not derived-resource conformance claims.
          items:
            type: string

    StudyDataRecord:
      type: object
      additionalProperties: false
      required: [id, bundleBase64, outputs]
      properties:
        id:
          type: string
          format: uuid
          description: Newly assigned derived Bundle identity, not the retained source record identity.
        bundleBase64:
          type: string
          maxLength: 89478488
          description: Base64 encoded FHIR R4 collection Bundle. The configured decoded budget defaults to 16 MiB and cannot exceed 64 MiB.
        outputs:
          type: array
          minItems: 1
          maxItems: 512
          items:
            $ref: '#/components/schemas/StudyDataOutput'

    StudyDataPage:
      type: object
      additionalProperties: false
      required: [id, studyId, versions, policy, records]
      properties:
        id:
          type: string
          format: uuid
          description: Page identity recorded in the committed disclosure-intent audit.
        studyId:
          type: string
          format: uuid
        versions:
          $ref: '#/components/schemas/StudyDataVersions'
        policy:
          type: string
          enum: [study-point-view-v1]
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudyDataRecord'
        nextBefore:
          type: string
          format: uuid
          description: Opaque continuation cursor. Omitted when the captured page has no continuation.

    StudyAuditAction:
      type: string
      enum:
        - consent.recorded
        - consent.pdf.disclosure
        - consent.records.disclosure
        - collection.plan.disclosure
        - collection.reconciliation.issued
        - collection.reconciliation.completed
        - enrollment.withdrawn
        - study.published
        - study.publication.disclosure
        - study.draft.deleted
        - study.draft.created
        - study.draft.edited
        - study.draft.validated
        - study.draft.disclosure
        - delegation.created
        - delegation.revoked
        - delegation.disclosure
        - study.bundle.disclosure
        - artifact.discard.scheduled
        - study.data.granted
        - study.audit.disclosure
        - study.data.disclosure
        - study.recording.disclosure

    StudyPublicationInput:
      type: object
      additionalProperties: false
      required: [validationId]
      properties:
        validationId:
          type: string
          format: uuid
          description: Server-issued immutable candidate ID and natural publication retry identity.

    ValidationStatus:
      type: string
      description: >
        `valid`: no finding is an error and no official finding states that a check was
        skipped. `invalid`: at least one finding is an error.
        `incomplete`: the official validator reported that it could not resolve the
        Questionnaire a response names, an enableWhen condition or a profile the resource
        declares or depends on, or could not check slicing cardinality or a code against a
        value set binding or answer options, so validity is not established. A code from a
        code system outside the offline package set is reported as information unless a
        value set check depends on it. `unavailable`: the validator
        could not be reached or returned no trustworthy result; for some inputs this
        repeats on every attempt. Only `valid` permits publication.
      enum: [valid, invalid, incomplete, unavailable]

    ValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, source, rule, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning, information]
        source:
          type: string
          description: >
            `fhir`: the official FHIR Validator. `grove`: the Grove FHIR IG or Grove
            questionnaire rules. `trove`: Trove's own publication and execution rules.
          enum: [fhir, grove, trove]
        rule:
          type: string
          maxLength: 200
          description: Stable rule or message identifier within its source.
        path:
          type: string
          maxLength: 500
          description: >
            FHIRPath of the element within the resource, for example
            `Questionnaire.item[1].answerOption[0]`, or the draft field. Empty when the
            finding concerns the whole input.
        language:
          type: string
          description: Language of the translation the finding concerns.
        componentId:
          type: string
          format: uuid
          description: Component the finding concerns, in draft validation results.
        message:
          type: string
          maxLength: 1000
        nextAction:
          type: string
          maxLength: 500
          description: What to change or do next, where the rule defines it.

    QuestionnaireValidation:
      type: object
      additionalProperties: false
      required: [componentId, draftRevision, status, sha256, translationLanguages, contractVersion, contractRevision, executionCapability, diagnostics]
      properties:
        componentId:
          type: string
          format: uuid
        draftRevision:
          type: string
          format: uuid
          description: Draft revision at which the stored resource was read.
        status:
          $ref: '#/components/schemas/ValidationStatus'
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the exact validated bytes.
        language:
          type: string
          description: The resource's base language as the Grove model reads it. Omitted when it cannot be read.
        translationLanguages:
          type: array
          uniqueItems: true
          items:
            type: string
        validatorIdentity:
          type: string
          description: The configured validator identity. Omitted when no validator is configured.
        contractVersion:
          type: string
        contractRevision:
          type: string
        executionCapability:
          type: string
        diagnostics:
          type: array
          maxItems: 201
          description: Findings ordered by severity, errors first.
          items:
            $ref: '#/components/schemas/ValidationDiagnostic'

    StudyDraftValidation:
      type: object
      additionalProperties: false
      required: [draftRevision, status, blockers, advisories, questionnaires]
      properties:
        draftRevision:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ValidationStatus'
        blockers:
          type: array
          description: Findings that prevent publication, including an unavailable or incomplete check.
          items:
            $ref: '#/components/schemas/ValidationDiagnostic'
        advisories:
          type: array
          description: Warnings and information that do not prevent publication.
          items:
            $ref: '#/components/schemas/ValidationDiagnostic'
        questionnaires:
          type: array
          items:
            $ref: '#/components/schemas/StudyQuestionnaireValidation'
        candidate:
          $ref: '#/components/schemas/StudyPublicationCandidate'

    StudyPublicationCandidate:
      type: object
      additionalProperties: false
      description: Present only when the status is `valid`.
      required: [id, publicationRevision, bundleSha256, validatorIdentity, contractRevision, executionCapability, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Immutable candidate ID and future publication ID.
        publicationRevision:
          type: integer
          minimum: 1
        bundleSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        validatorIdentity:
          type: string
        contractRevision:
          type: string
        executionCapability:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    StudyQuestionnaireValidation:
      type: object
      additionalProperties: false
      required: [componentId, status, sha256, translationLanguages]
      properties:
        componentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ValidationStatus'
        language:
          type: string
          description: The validated resource's base language (`Questionnaire.language`). Omitted when it cannot be read.
        translationLanguages:
          type: array
          uniqueItems: true
          description: Languages of the resource's translation extensions, sorted.
          items:
            type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    StudyDelegationPreset:
      type: string
      enum: [inspectStudy, editStudyDraft]

    StudyDelegationInput:
      type: object
      additionalProperties: false
      required: [clientId, preset, expiresAt]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        preset:
          $ref: '#/components/schemas/StudyDelegationPreset'
        expiresAt:
          type: string
          format: date-time

    StudyDelegation:
      type: object
      additionalProperties: false
      required: [id, studyId, clientId, preset, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        clientId:
          type: string
        preset:
          $ref: '#/components/schemas/StudyDelegationPreset'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    StudyDelegationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudyDelegation'
        nextBefore:
          type: string
          format: uuid

    AuditActor:
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer:
          type: string
        subject:
          type: string

    StudyAuditRecord:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actor, action, targetId, outcome, correlationId]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        initiator:
          $ref: '#/components/schemas/AuditActor'
        executingClientId:
          type: string
          description: Registered OAuth client from verified authentication.
        delegationId:
          type: string
          format: uuid
          description: Server-authorized application grant, not a credential.
        action:
          $ref: '#/components/schemas/StudyAuditAction'
        targetId:
          type: string
          format: uuid
        targetVersion:
          type: string
        outcome:
          type: string
          enum: [succeeded, disclosure_intent]
        correlationId:
          type: string
          format: uuid
        applicationRevision:
          type: string

    StudyAuditPage:
      type: object
      additionalProperties: false
      required: [studyId, records]
      properties:
        studyId:
          type: string
          format: uuid
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudyAuditRecord'
        nextBefore:
          type: string
          format: uuid
          description: Last returned event ID when another older page exists.

    EventTarget:
      type: object
      additionalProperties: false
      required: [consentId, outputFullUrls]
      properties:
        consentId:
          type: string
          format: uuid
          description: Exact immutable consent; enrollment and publication are resolved server-side.
        outputFullUrls:
          type: array
          minItems: 1
          maxItems: 512
          uniqueItems: true
          description: Exact clinical output entry addresses in this event, not moving logical identities.
          items:
            type: string
            minLength: 1
            maxLength: 512

    EventTargets:
      type: array
      minItems: 0
      maxItems: 16
      description: >
        Distinct consent IDs; each target lists distinct output addresses. Normalized intent is limited to 512 KiB.
        Active events and attribution commands require at least one target. Retraction events require an empty
        array and never grant study access. Receipt lookup repeats the original event's targets exactly.
      items:
        $ref: '#/components/schemas/EventTarget'

    EventSubmission:
      type: object
      additionalProperties: false
      required: [eventBase64, targets]
      properties:
        eventBase64:
          type: string
          minLength: 4
          maxLength: 22369624
          description: RFC 4648 standard padded base64, without whitespace, of one Grove Mobile record as a one-record Bundle. The configured decoded budget defaults to 4 MiB and cannot exceed 16 MiB.
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventBatchSubmission:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/EventSubmission'

    RecordingTransferDeclaration:
      type: object
      additionalProperties: false
      required:
      - attachmentPath
      - outputFullUrl
      - profile
      - format
      - effectiveAt
      - effectiveEnd
      - content
      - targets
      properties:
        attachmentPath:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[A-Za-z0-9_./-]+$
          description: Stable relative attachment path; no empty, dot or parent segments, escapes, query or fragment.
        outputFullUrl:
          type: string
          minLength: 1
          maxLength: 512
          description: Exact recording DocumentReference address in its immutable clinical record.
        profile:
          type: string
          description: Supported recording-document profile, independently checked against collection authority.
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact native or provider catalog source token, independently verified against the final recording's source evidence. Required for new declarations; absent only in retained HealthKit workout-route evidence.
        format:
          type: string
          description: Registered Grove recording-format code, checked with the exact source token and output profile.
        effectiveAt:
          type: string
          format: date-time
        effectiveEnd:
          type: string
          format: date-time
          description: Inclusive measurement end, at or after effectiveAt; actual recording bounds are checked at clinical
            admission.
        content:
          $ref: '#/components/schemas/RecordingTransferContent'
        targets:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/EventTarget'
          description: Distinct consent targets, each selecting only outputFullUrl.
    RecordingTransferContent:
      type: object
      additionalProperties: false
      required:
      - encoding
      - storedByteCount
      - storedSHA256
      - sourceByteCount
      - sourceSHA256
      properties:
        encoding:
          type: string
          enum:
          - identity
          - zstd
          description: Encoding inside the octet-stream body, not HTTP Content-Encoding.
        storedByteCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        storedSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceByteCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        sourceSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
      description: Exact stored and decoded-source commitments, bounded separately by deployment configuration. Identity
        encoding requires identical counts and digests. Source commitments and format validity are checked when admitting
        the clinical attachment.
    RecordingTransferRegistration:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - transferId
      - declarationSHA256
      - storedByteCount
      - storedSHA256
      properties:
        sourceId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        declarationSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Server commitment to the entire declaration; retain it to match subsequent receipts.
        storedByteCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        storedSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
    RecordingTransferReceipt:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - transferId
      - artifactId
      - declarationSHA256
      - storedByteCount
      - storedSHA256
      - verifiedAt
      - expiresAt
      properties:
        sourceId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
          description: Opaque identifier for binding these exact owned bytes to a clinical attachment.
        declarationSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
        storedByteCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        storedSHA256:
          type: string
          pattern: ^[0-9a-f]{64}$
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Latest time to accept the unretained attachment; not a permanent storage promise.

    RecordBundleSubmission:
      type: object
      additionalProperties: false
      required: [bundleBase64, records]
      properties:
        bundleBase64:
          type: string
          minLength: 4
          maxLength: 22370988
          description: Canonical RFC 4648 padded base64 of one Grove active or retraction Bundle. The configured decoded budget defaults to 4 MiB plus 1 KiB and cannot exceed 16 MiB plus 1 KiB.
        records:
          type: array
          minItems: 1
          maxItems: 16
          description: Exactly one commitment per lifecycle record, in response order; entry addresses preserve original record custody.
          items:
            $ref: '#/components/schemas/RecordBundleMember'

    RecordBundleMember:
      type: object
      additionalProperties: false
      required: [commitment, entryFullUrls]
      properties:
        commitment:
          $ref: '#/components/schemas/EventReceiptLookup'
        recordings:
          type: array
          maxItems: 16
          description: >
            Exact uploaded artifacts for this record's relative recording attachments. Paths, transfer IDs and artifact
            IDs must be distinct. The receiver verifies ownership, the retained declaration, decoded content and current
            consent before retaining artifacts with clinical custody. Omit for records without external recordings.
          items:
            $ref: '#/components/schemas/RecordingAttachmentBinding'
        entryFullUrls:
          type: array
          minItems: 1
          maxItems: 512
          uniqueItems: true
          description: Original staged record entry order, including shared nodes; this list confers no collection or study authority.
          items:
            type: string
            minLength: 1
            maxLength: 512

    RecordingAttachmentBinding:
      type: object
      additionalProperties: false
      required: [attachmentPath, transferId, artifactId]
      properties:
        attachmentPath:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[A-Za-z0-9_./-]+$
          description: Exact relative Attachment.url in the original record and retained transfer declaration.
        transferId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
          description: The artifact from the completed transfer receipt; an identifier alone confers no authority.

    EventBatchResult:
      description: >
        An immutable custody receipt or a per-event problem. Retry transient
        problems (408, 429, 5xx) with unchanged bytes and targets and bounded
        backoff. Preserve other rejected events for inspection. Never interpret
        an outer HTTP 200 as acceptance of every member.
      oneOf:
        - $ref: '#/components/schemas/EventReceipt'
        - $ref: '#/components/schemas/ProblemDetails'

    EventAttribution:
      type: object
      additionalProperties: false
      required: [commandId, targets]
      properties:
        commandId:
          type: string
          format: uuid
          description: Durable client command ID, unique within the registered source.
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventAttributionReceipt:
      type: object
      additionalProperties: false
      required: [commandId, eventId, targetIntentSHA256, acceptedAt, authorizedOutputCount]
      properties:
        commandId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        targetIntentSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        acceptedAt:
          type: string
          format: date-time
        authorizedOutputCount:
          type: integer
          minimum: 1
          maximum: 8192
          description: Requested exact consent/output pairs authorized at command acceptance, including already-existing grants; not current access.

    EventReceiptLookup:
      type: object
      additionalProperties: false
      required: [producerEventIdentifier, payloadSHA256, targets]
      properties:
        producerEventIdentifier:
          type: object
          additionalProperties: false
          required: [system, value]
          properties:
            system:
              type: string
              minLength: 1
              maxLength: 4096
            value:
              type: string
              minLength: 1
              maxLength: 4096
        payloadSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventReceipt:
      type: object
      additionalProperties: false
      description: >
        Durable custody acknowledgement for one source-record version or retraction, not a
        statement of current study access or graph visibility. Before retiring
        staged bytes, the client must match the source, complete producer event
        identifier, payload SHA-256 and target-intent SHA-256 against its durable staging record. An HTTP
        success alone is insufficient. Exact retries return the persisted receipt. Accepted byte
        representations of the same clinical version share eventId; payloadSHA256, receivedAt and
        nodeCount describe the specific retained representation. Additional representations do not
        create new clinical facts, versions or study grants.
      required:
        - eventId
        - sourceId
        - producerEventIdentifier
        - payloadSHA256
        - targetIntentSHA256
        - receivedAt
        - nodeCount
      properties:
        eventId:
          type: string
          format: uuid
          description: Server-assigned clinical version or retraction ID, shared by its accepted byte representations.
        sourceId:
          type: string
          format: uuid
        producerEventIdentifier:
          type: object
          additionalProperties: false
          description: Complete record-version or record-retraction identifier from the lifecycle Provenance entry key.
          required:
            - system
            - value
          properties:
            system:
              type: string
              format: uri
            value:
              type: string
              minLength: 1
        payloadSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase SHA-256 of the accepted event bytes, before any JSON normalization.
        targetIntentSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            SHA-256 of UTF-8 canonical target JSON: array sorted by consent ID,
            lowercase UUIDs, lexically sorted distinct ASCII output addresses,
            object keys consentId then outputFullUrls, compact JSON without escaped
            slashes. Bind this to the original staged intent, not later attribution.
        receivedAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
          minimum: 1

    ParticipantCollectionPlan:
      type: object
      additionalProperties: false
      required: [enrollmentId, studyId, title, stateVersion, asOf, windows]
      properties:
        enrollmentId:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
          description: Stable study identity for this enrollment; checked against complete enrollment discovery.
        title:
          $ref: '#/components/schemas/LocalizedString'
          description: Study title from the enrollment's adopted publication, retained for offline collection settings and withdrawal.
        endsAt:
          type: string
          format: date-time
          description: Exclusive enrollment end resolved once by the server; omitted means ongoing. Stops acquisition, not receipt recovery.
        stateVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          type: string
          format: date-time
          description: Server observation time; not an expiration or promise of future eligibility.
        windows:
          type: array
          maxItems: 1024
          description: Ordered by consent adoption, never by latest publication. Empty means no collection.
          items:
            $ref: '#/components/schemas/ConsentCollectionWindow'

    NativeCollectionReconciliationRequest:
      type: object
      additionalProperties: false
      required: [sourceId]
      properties:
        sourceId:
          type: string
          format: uuid

    NativeCollectionReconciliationResponse:
      type: object
      additionalProperties: false
      required: [instructions]
      properties:
        instructions:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/NativeCollectionReconciliationInstruction'

    NativeCollectionReconciliationInstruction:
      type: object
      additionalProperties: false
      description: >
        Current online authority for one finite sweep of an ended, originally accepted
        window. It does not extend the enrollment's cached collection plan. Renewal
        keeps the identity, source, accepted scope and window, and only moves the lease.
      required:
        - id
        - sourceId
        - enrollmentId
        - studyId
        - stateVersion
        - issuedAt
        - expiresAt
        - consentId
        - publicationId
        - revision
        - profile
        - sourceTypeIdentifier
        - start
        - end
        - includeWorkoutRoutes
      properties:
        id:
          type: string
          format: uuid
          description: Stable sweep identity for this source and window, unchanged by renewal.
        sourceId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        stateVersion:
          type: integer
          format: int64
          minimum: 1
        issuedAt:
          type: string
          format: date-time
          description: Server time of this issuance or renewal; not a clinical or source insertion time.
        expiresAt:
          type: string
          format: date-time
          description: End of the lease. Unfinished work pauses and keeps its position until renewed online.
        consentId:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        profile:
          type: string
          format: uri
          maxLength: 2048
          description: Exact output profile, including the recording profile for an opted-in workout route.
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact native source token. Profile membership alone does not authorize a stream.
        start:
          type: string
          format: date-time
          description: Original accepted window start; whole overlapping sessions remain eligible.
        end:
          type: string
          format: date-time
          description: Original closed window end, no later than issuedAt.
        includeWorkoutRoutes:
          type: boolean
          description: The accepted workout-route option of the window; an instruction cannot add it.

    ConsentCollectionWindow:
      type: object
      additionalProperties: false
      required: [consentId, publicationId, revision, start, requirements]
      properties:
        consentId:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        start:
          type: string
          format: date-time
          description: Consent adoption time; measurement boundaries are carried by each resolved requirement.
        end:
          type: string
          format: date-time
          description: Next consent adoption time, if any. This does not change the retained historical measurement starts.
        requirements:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/CollectionPlanRequirement'

    EnrollmentPeriod:
      type: object
      additionalProperties: false
      description: >
        Published enrollment end rule. Resolve once from the stored enrollment instant
        using the declared calendar and time zone. A duration and a fixed end may be
        combined; the earlier bound wins. Omitting both means ongoing enrollment.
        Later publication or revision adoption does not change an existing enrollment's end.
      required: [calendar, timeZone]
      properties:
        calendar:
          type: string
          enum: [gregorian]
        timeZone:
          type: string
          minLength: 1
          maxLength: 128
          description: IANA time-zone identifier or UTC.
        duration:
          $ref: '#/components/schemas/DateComponents'
          description: Positive calendar duration from enrollment; all components must be nonnegative.
        end:
          type: string
          format: date-time
          description: Exclusive fixed closing instant; new enrollment at or beyond it is refused.

    CollectionMeasurementWindow:
      type: object
      additionalProperties: false
      description: >
        Measurement scope resolved once when this publication is accepted, not
        when a device starts a query. Omitted start means consent adoption;
        oldestSample authorizes all available history. Relative components must
        be nonnegative and at least one must be positive. An end is exclusive.
      required: [calendar, timeZone]
      properties:
        calendar:
          type: string
          enum: [gregorian]
        timeZone:
          type: string
          minLength: 1
          maxLength: 128
          description: IANA time-zone identifier, or UTC; never the device's implicit current zone.
        start:
          $ref: '#/components/schemas/ExportSessionStartDate'
        end:
          type: string
          format: date-time

    CollectionTimeBasis:
      type: string
      enum: [measurement-time, clinical-record-download, cda-source-document-period]
      description: Time basis used by the retained collection window. Omission means measurement-time for existing measurement scopes. Clinical and CDA document requirements must explicitly preserve their source-date basis; embedded care dates are not inferred or used for selection.

    CollectionPlanRequirement:
      type: object
      additionalProperties: false
      description: Exact measurement scope retained for an accepted publication.
      required: [profile, sourceKind, start]
      properties:
        includeWorkoutRoutes:
          type: boolean
          default: false
          description: Whether this accepted requirement includes precise workout routes. Only valid for the workout profile; omission means false.
        profile:
          type: string
          format: uri
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact catalog source token. Required for new native streams and all provider requirements; legacy unqualified heart-rate, body-weight, sleep-stage and workout scopes remain supported.
        providerRegistrationId:
          type: string
          format: uuid
          description: Deployment-approved provider integration registration. Required for server-worker and forbidden for participant-app; distinct from the participant connection or source ID.
        sourceKind:
          type: string
          enum: [participant-app, server-worker]
        start:
          type: string
          format: date-time
          description: Inclusive window start; may precede consent adoption. Sleep records are included whole when they overlap the window.
        end:
          type: string
          format: date-time
          description: Exclusive window end, bounded by the next adoption when applicable. Overlapping sleep records may end after this boundary.

        timeBasis:
          $ref: '#/components/schemas/CollectionTimeBasis'

    CollectionCapability:
      type: object
      additionalProperties: false
      required:
        - profile
        - repositoryKind
        - sourceTypeIdentifier
        - displayNameEnglish
        - displayNameGerman
        - effectiveTime
        - supportsWorkoutRoutes
      properties:
        profile:
          type: string
          format: uri
        repositoryKind:
          type: string
          enum: [healthkit, sensorkit]
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
        displayNameEnglish:
          type: string
          minLength: 1
          maxLength: 256
        displayNameGerman:
          type: string
          minLength: 1
          maxLength: 256
        effectiveTime:
          type: string
          enum: [point, interval, point-or-interval]
          description: Effective-time shapes accepted for the complete FHIR output, before study-window filtering.
        supportsWorkoutRoutes:
          type: boolean
          description: Whether precise workout route collection can be opted into independently for this measurement.
        isOriginalRecording:
          type: boolean
          description: This output includes an original source recording, separately selected from structured summaries.
        requiredCompanionProfiles:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uri
          description: Other output profiles from this exact source that need collection authority to retain the complete producer record. They are not implicitly selected or granted to this study.

        timeBasis:
          $ref: '#/components/schemas/CollectionTimeBasis'

    CollectionRequirement:
      type: object
      additionalProperties: false
      description: >
        Explicit backend collection permission, independent of native HealthKit
        components. The receiver supports Grove Mobile heart-rate and body-weight point quantities
        and sleep-stage intervals and workout sessions from participant-app streams. A point must be
        inside the accepted half-open measurement window. A sleep interval or workout session is
        collected in full if it overlaps that window, including all workout segments and statistics; touching a boundary alone
        is insufficient. Omitting the window starts collection at consent adoption.
        This does not attest the source device.
      required:
        - profile
        - sourceKind
      properties:
        includeWorkoutRoutes:
          type: boolean
          default: false
          description: Request precise workout routes in addition to workout sessions. Only valid for the workout profile; defaults to false and requires participant acceptance of the published revision.
        measurementWindow:
          $ref: '#/components/schemas/CollectionMeasurementWindow'
        profile:
          type: string
          format: uri
          examples:
            - https://grovealliance.org/fhir/mobile/StructureDefinition/grove-mobile-heart-rate
            - https://grovealliance.org/fhir/mobile/StructureDefinition/grove-mobile-body-weight
        sourceTypeIdentifier:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact catalog source token. Required for new native streams and all provider requirements; legacy unqualified heart-rate, body-weight, sleep-stage and workout scopes remain supported.
        providerRegistrationId:
          type: string
          format: uuid
          description: Deployment-approved provider integration registration. Required for server-worker and forbidden for participant-app; distinct from the participant connection or source ID.
        sourceKind:
          type: string
          enum:
            - participant-app
            - server-worker

        timeBasis:
          $ref: '#/components/schemas/CollectionTimeBasis'

    NativeSourceRepository:
      type: string
      enum: [healthkit, sensorkit]
      description: Native repository identity; assignment alone does not imply receiver support for every data type.

    SourceInstallationCredential:
      type: string
      minLength: 44
      maxLength: 44
      pattern: '^[A-Za-z0-9+/]{43}=$'
      description: Canonical base64 of a random 256-bit installation secret, independent of identity and signing keys.

    SourceBusinessIdentifier:
      type: object
      additionalProperties: false
      required: [system, value]
      properties:
        system:
          type: string
          format: uri
          maxLength: 512
        value:
          type: string
          minLength: 1
          maxLength: 256

    ParticipantSource:
      type: object
      additionalProperties: false
      description: >
        Server-assigned logical source shared by a participant's authorized
        installations for one native repository. Identifiers are not credentials
        or provider attestation. Reinstalling does not change this identity.
      required: [id, keyID, keyEpoch, repositoryKind, repositoryScope, kind, eventIdentifierSystem, identifierRoot, participantIdentifier, createdAt]
      properties:
        id:
          type: string
          format: uuid
        keyID:
          type: string
          format: uuid
        keyEpoch:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[1-9][0-9]*$'
          description: Immutable derivation-key epoch. Encryption-key rotation does not change it; current sources use epoch 1.
        repositoryKind:
          $ref: '#/components/schemas/NativeSourceRepository'
        repositoryScope:
          $ref: '#/components/schemas/SourceBusinessIdentifier'
        kind:
          type: string
          enum: [participant-app]
        eventIdentifierSystem:
          type: string
          format: uri
          description: Immutable Grove record-version namespace; retractions use the corresponding record-retraction namespace.
        identifierRoot:
          type: string
          format: uri
          maxLength: 256
          description: >
            Derive DeploymentIdentifierSystems from this server-assigned root,
            keyID and keyEpoch. The derived recordVersion system must equal
            eventIdentifierSystem. Use the supplied repositoryScope in all
            conversions and retain exact staged record bytes across retries.
        participantIdentifier:
          type: object
          additionalProperties: false
          description: Complete FHIR Patient business identifier assigned to this participant within this deployment.
          required: [system, value]
          properties:
            system:
              type: string
              format: uri
            value:
              type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: Permanent logical-source revocation affects every installation; never cleared.

    ParticipantSourceInstallation:
      type: object
      additionalProperties: false
      required: [registrationID, sourceID, createdAt]
      properties:
        registrationID:
          type: string
          format: uuid
        sourceID:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: Permanent installation revocation; other installations retain independent authority.

    ParticipantSourceRegistration:
      type: object
      additionalProperties: false
      required: [source, installation]
      properties:
        source:
          $ref: '#/components/schemas/ParticipantSource'
        installation:
          $ref: '#/components/schemas/ParticipantSourceInstallation'

    ParticipantSourceIdentityRecovery:
      type: object
      additionalProperties: false
      required: [registration, identityKeyBase64]
      properties:
        registration:
          $ref: '#/components/schemas/ParticipantSourceRegistration'
        identityKeyBase64:
          type: string
          minLength: 44
          maxLength: 44
          pattern: '^[A-Za-z0-9+/]{43}=$'
          description: Canonical base64 of the existing 256-bit source identity key. Store under the client's account-bound OS protections.

    LocalizationKey:
      type: string
      description: 'A locale identifier in language-region format (e.g. en-US, de-DE)'
      examples:
        - 'en-US'

    LanguageTag:
      type: string
      description: >
        BCP 47 language tag of written content in canonical case: a language,
        optionally followed by a script and a region. Distinct tags stay distinct;
        a region is not required. The special codes und, mul, zxx, mis and
        qaa–qtz name no written language and are rejected.
      pattern: '^(?!(und|mul|zxx|mis|q[a-t][a-z])(-|$))[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$'
      examples:
        - 'de'
        - 'zh-Hant'
        - 'pt-BR'

    LocalizedString:
      type: object
      description: Localized string keyed by locale (e.g., "en-US" -> "value")
      additionalProperties:
        type: string
      examples:
        - en-US: 'Hello'

    DateComponents:
      type: object
      description: >
        Calendar-relative offset from the anchor specified by the containing policy.
        At least one component must be provided. Uses Swift DateComponents naming (singular).
      properties:
        year:
          type: integer
          minimum: 0
        month:
          type: integer
          minimum: 0
        day:
          type: integer
          minimum: 0
      minProperties: 1
      additionalProperties: false

    SampleTypesCollection:
      type: array
      description: HealthKit sample types in GroveHealthKit format (ClassName;Identifier)
      items:
        type: string
      examples:
        - - 'HKQuantityType;HKQuantityTypeIdentifierHeartRate'
          - 'HKQuantityType;HKQuantityTypeIdentifierStepCount'
          - 'HKCategoryType;HKCategoryTypeIdentifierSleepAnalysis'

    # ── Groups ────────────────────────────────────────────────────────────

    GroupResponse:
      type: object
      description: Group synced from Keycloak. Name is unique.
      required:
        - id
        - name
        - icon
      properties:
        id:
          type: string
          format: uuid
          description: Keycloak group ID
        name:
          type: string
          description: Unique group name (matches Keycloak group name)
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name, stored as Keycloak group attribute)

    # ── Studies — Building Blocks ─────────────────────────────────────────

    StudyDetailContent:
      type: object
      description: Study detail fields in one language
      required:
        - title
      properties:
        title:
          type: string
        shortTitle:
          type: string
        explanationText:
          type: string
        shortExplanationText:
          type: string

    StudyDetailData:
      type: object
      description: >
        Study details keyed by language tag. The source language names the
        language the details were written in; content must include it.
      additionalProperties: false
      required:
        - sourceLanguage
        - content
      properties:
        sourceLanguage:
          $ref: '#/components/schemas/LanguageTag'
        content:
          type: object
          minProperties: 1
          propertyNames:
            $ref: '#/components/schemas/LanguageTag'
          additionalProperties:
            $ref: '#/components/schemas/StudyDetailContent'
      examples:
        - sourceLanguage: 'en'
          content:
            en:
              title: 'My Heart Counts'
              shortTitle: 'MHC'
              explanationText: 'This study aims to...'
              shortExplanationText: 'A heart health study'
            de:
              title: 'My Heart Counts'
              shortExplanationText: 'Eine Studie zur Herzgesundheit'

    ParticipationCriterion:
      description: >
        A criterion which must be satisfied for a person to participate in a study.
        Uses a discriminated union on "type". Leaf criteria carry a single value.
        Logical operators (not, all, any) are recursive.
      oneOf:
        - $ref: '#/components/schemas/AgeAtLeastCriterion'
        - $ref: '#/components/schemas/IsFromRegionCriterion'
        - $ref: '#/components/schemas/SpeaksLanguageCriterion'
        - $ref: '#/components/schemas/NotCriterion'
        - $ref: '#/components/schemas/AllCriterion'
        - $ref: '#/components/schemas/AnyCriterion'
      discriminator:
        propertyName: type
        mapping:
          ageAtLeast: '#/components/schemas/AgeAtLeastCriterion'
          isFromRegion: '#/components/schemas/IsFromRegionCriterion'
          speaksLanguage: '#/components/schemas/SpeaksLanguageCriterion'
          not: '#/components/schemas/NotCriterion'
          all: '#/components/schemas/AllCriterion'
          any: '#/components/schemas/AnyCriterion'

    AgeAtLeastCriterion:
      type: object
      description: Requires the participant to be at least a certain age
      required:
        - type
        - age
      properties:
        type:
          type: string
          enum: [ageAtLeast]
        age:
          type: integer
          minimum: 0
      additionalProperties: false

    IsFromRegionCriterion:
      type: object
      description: Requires the participant to be from a specific region
      required:
        - type
        - region
      properties:
        type:
          type: string
          enum: [isFromRegion]
        region:
          type: string
          description: Region identifier (e.g. "US", "DE")
      additionalProperties: false

    SpeaksLanguageCriterion:
      type: object
      description: Requires the participant to speak a specific language
      required:
        - type
        - language
      properties:
        type:
          type: string
          enum: [speaksLanguage]
        language:
          type: string
          description: Language identifier (e.g. "en", "de")
      additionalProperties: false

    NotCriterion:
      type: object
      description: Negates a criterion
      required:
        - type
        - criterion
      properties:
        type:
          type: string
          enum: [not]
        criterion:
          $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false

    AllCriterion:
      type: object
      description: Requires all criteria to be satisfied (logical AND)
      required:
        - type
        - criteria
      properties:
        type:
          type: string
          enum: [all]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false
      examples:
        - type: all
          criteria:
            - type: ageAtLeast
              age: 18
            - type: any
              criteria:
                - type: isFromRegion
                  region: 'US'
                - type: isFromRegion
                  region: 'DE'

    AnyCriterion:
      type: object
      description: Requires at least one criterion to be satisfied (logical OR)
      required:
        - type
        - criteria
      properties:
        type:
          type: string
          enum: [any]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false

    # ── Studies — Request / Response ──────────────────────────────────────

    StudyListItem:
      type: object
      description: Summary of a study for list views
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Study title in the details' source language

    StudyCreateInput:
      type: object
      description: Request body for creating a new study
      required:
        - title
        - sourceLanguage
        - icon
      properties:
        title:
          type: string
          description: Study title, written in the source language
          examples:
            - 'My Heart Counts'
        sourceLanguage:
          $ref: '#/components/schemas/LanguageTag'
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart

    StudyPatchInput:
      type: object
      description: Partial update for a study. All fields are optional.
      properties:
        enrollmentPeriod:
          $ref: '#/components/schemas/EnrollmentPeriod'
        collectionRequirements:
          type: array
          maxItems: 512
          uniqueItems: true
          description: Empty disables backend collection in the next publication; existing publications are unchanged.
          items:
            $ref: '#/components/schemas/CollectionRequirement'
        receivesDeviceUnitIdentifiers:
          type: boolean
          description: >
            Whether study data released under the next publication includes facts that
            identify one physical device unit. When false, recording and host Devices keep
            only status, type, manufacturer, model number, versions, parent, patient, UDI
            device identifier, issuer and jurisdiction, and model, manufacturer and UDI
            label names, and application Devices also keep their user-friendly name and
            the bundle identifier; references to Devices keep only their address and type;
            HealthKit source names, bundle identifiers and readable sync
            identifiers of a device-assigned source, and the metadata entries
            HKDeviceSerialNumber, HKDeviceName and HKUDIProductionIdentifier are removed;
            native, provider and FHIR collection recordings are not released. Retained
            custody is unchanged.
        locales:
          type: array
          uniqueItems: true
          description: Language-region locales of the study's consent and informational documents
          items:
            $ref: '#/components/schemas/LocalizationKey'
          minItems: 1
          examples:
            - ['en-US', 'de-DE']
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart
        details:
          $ref: '#/components/schemas/StudyDetailData'
        participationCriterion:
          $ref: '#/components/schemas/ParticipationCriterion'
        consent:
          $ref: '#/components/schemas/StudyConsent'
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    StudyResponse:
      type: object
      description: Full study response
      required:
        - enrollmentPeriod
        - collectionRequirements
        - receivesDeviceUnitIdentifiers
        - draftRevision
        - id
        - locales
        - icon
        - details
        - participationCriterion
        - consent
        - visibility
        - enrollmentConditions
      properties:
        enrollmentPeriod:
          $ref: '#/components/schemas/EnrollmentPeriod'
        draftRevision:
          type: string
          format: uuid
          description: Opaque revision of the complete editable study draft.
        collectionRequirements:
          type: array
          maxItems: 512
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CollectionRequirement'
        receivesDeviceUnitIdentifiers:
          type: boolean
          description: Draft setting; see StudyPatchInput.receivesDeviceUnitIdentifiers.
        id:
          type: string
          format: uuid
        locales:
          type: array
          uniqueItems: true
          description: Language-region locales of the study's consent and informational documents
          items:
            $ref: '#/components/schemas/LocalizationKey'
          examples:
            - ['en-US', 'de-DE']
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart
        details:
          $ref: '#/components/schemas/StudyDetailData'
        participationCriterion:
          $ref: '#/components/schemas/ParticipationCriterion'
        consent:
          $ref: '#/components/schemas/StudyConsent'
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    # ── Enrollment Conditions ──────────────────────────────────────────────

    EnrollmentConditions:
      type: string
      description: Defines how enrollment into a study works
      enum:
        - none
        - requiresInvitationCode

    # ── Published Studies ────────────────────────────────────────────────

    StudyVisibility:
      type: string
      description: Whether a published study is listed publicly or only accessible via invitation code
      enum:
        - public
        - unlisted

    PublishedStudyResponse:
      type: object
      description: A published study revision
      required:
        - id
        - studyId
        - revision
        - visibility
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        revision:
          type: integer
          description: The revision number of this publication
          examples:
            - 1
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When this revision was published

    # ── Components — Shared ───────────────────────────────────────────────

    Component:
      type: object
      description: A component summary with type, id, and name
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - informational
            - questionnaire
            - healthDataCollection
          description: Component type
        name:
          type: string
          description: Display name for the component

    # ── Component Schedules ─────────────────────────────────────────────

    ComponentScheduleInput:
      type: object
      description: Request body for creating or updating a component schedule
      required:
        - scheduleDefinition
        - completionPolicy
        - notification
      properties:
        scheduleDefinition:
          $ref: '#/components/schemas/ScheduleDefinition'
        completionPolicy:
          $ref: '#/components/schemas/AllowedCompletionPolicy'
        notification:
          type: boolean
          description: Whether notifications are enabled for this schedule. When true, uses task-based notification threading.

    ComponentSchedule:
      type: object
      description: A schedule defining when a component should be presented to the participant
      required:
        - id
        - scheduleDefinition
        - completionPolicy
        - notification
      properties:
        id:
          type: string
          format: uuid
          description: Schedule ID (assigned by server on creation)
        scheduleDefinition:
          $ref: '#/components/schemas/ScheduleDefinition'
        completionPolicy:
          $ref: '#/components/schemas/AllowedCompletionPolicy'
        notification:
          type: boolean
          description: Whether notifications are enabled for this schedule. When true, uses task-based notification threading.

    ScheduleDefinition:
      description: Defines when and how often a schedule fires
      oneOf:
        - $ref: '#/components/schemas/OnceScheduleDefinition'
        - $ref: '#/components/schemas/RepeatedScheduleDefinition'
      discriminator:
        propertyName: type
        mapping:
          once: '#/components/schemas/OnceScheduleDefinition'
          repeated: '#/components/schemas/RepeatedScheduleDefinition'

    OnceScheduleDefinition:
      type: object
      description: A schedule that fires a single time
      required:
        - type
        - pattern
      properties:
        type:
          type: string
          enum: [once]
        pattern:
          $ref: '#/components/schemas/OneTimeSchedule'
      additionalProperties: false

    RepeatedScheduleDefinition:
      type: object
      description: A schedule that fires repeatedly based on a pattern
      required:
        - type
        - pattern
      properties:
        type:
          type: string
          enum: [repeated]
        pattern:
          $ref: '#/components/schemas/RepetitionPattern'
        offset:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false

    OneTimeSchedule:
      description: Defines when a one-time schedule fires
      oneOf:
        - $ref: '#/components/schemas/DateOneTimeSchedule'
        - $ref: '#/components/schemas/EventOneTimeSchedule'
      discriminator:
        propertyName: type
        mapping:
          date: '#/components/schemas/DateOneTimeSchedule'
          event: '#/components/schemas/EventOneTimeSchedule'

    DateOneTimeSchedule:
      type: object
      description: Fires once at a specific date
      required:
        - type
        - dateComponents
      properties:
        type:
          type: string
          enum: [date]
        dateComponents:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false

    EventOneTimeSchedule:
      type: object
      description: Fires once in response to a study lifecycle event
      required:
        - type
        - event
      properties:
        type:
          type: string
          enum: [event]
        event:
          $ref: '#/components/schemas/StudyLifecycleEvent'
        offsetInDays:
          type: integer
          default: 0
          description: Number of days after the event
        time:
          $ref: '#/components/schemas/ScheduleTime'
      additionalProperties: false
      examples:
        - type: event
          event:
            type: activation
          offsetInDays: 1
          time:
            hour: 9
            minute: 0

    RepetitionPattern:
      description: Defines how a repeated schedule recurs
      oneOf:
        - $ref: '#/components/schemas/DailyRepetition'
        - $ref: '#/components/schemas/WeeklyRepetition'
        - $ref: '#/components/schemas/MonthlyRepetition'
      discriminator:
        propertyName: type
        mapping:
          daily: '#/components/schemas/DailyRepetition'
          weekly: '#/components/schemas/WeeklyRepetition'
          monthly: '#/components/schemas/MonthlyRepetition'

    DailyRepetition:
      type: object
      description: Repeats every N days at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [daily]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N days
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    WeeklyRepetition:
      type: object
      description: Repeats every N weeks on an optional weekday at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [weekly]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N weeks
        weekday:
          type: string
          description: Day of week (e.g. "monday", "tuesday"). Omit to repeat relative to enrollment date.
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    MonthlyRepetition:
      type: object
      description: Repeats every N months on an optional day at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [monthly]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N months
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month. Omit to repeat relative to enrollment date.
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    StudyLifecycleEvent:
      description: A study lifecycle event that can trigger a one-time schedule
      oneOf:
        - $ref: '#/components/schemas/EnrollmentEvent'
        - $ref: '#/components/schemas/ActivationEvent'
        - $ref: '#/components/schemas/UnenrollmentEvent'
        - $ref: '#/components/schemas/StudyEndEvent'
        - $ref: '#/components/schemas/CompletedTaskEvent'
      discriminator:
        propertyName: type
        mapping:
          enrollment: '#/components/schemas/EnrollmentEvent'
          activation: '#/components/schemas/ActivationEvent'
          unenrollment: '#/components/schemas/UnenrollmentEvent'
          studyEnd: '#/components/schemas/StudyEndEvent'
          completedTask: '#/components/schemas/CompletedTaskEvent'

    EnrollmentEvent:
      type: object
      description: Triggered on first enrollment
      required:
        - type
      properties:
        type:
          type: string
          enum: [enrollment]
      additionalProperties: false

    ActivationEvent:
      type: object
      description: Triggered on study activation
      required:
        - type
      properties:
        type:
          type: string
          enum: [activation]
      additionalProperties: false

    UnenrollmentEvent:
      type: object
      description: Triggered when participant unenrolls
      required:
        - type
      properties:
        type:
          type: string
          enum: [unenrollment]
      additionalProperties: false

    StudyEndEvent:
      type: object
      description: Triggered when the study officially ends
      required:
        - type
      properties:
        type:
          type: string
          enum: [studyEnd]
      additionalProperties: false

    CompletedTaskEvent:
      type: object
      description: Triggered when a specific component task is completed
      required:
        - type
        - componentId
      properties:
        type:
          type: string
          enum: [completedTask]
        componentId:
          type: string
          format: uuid
          description: ID of the component whose completion triggers this event
      additionalProperties: false

    ScheduleTime:
      type: object
      description: Time of day for a schedule occurrence
      required:
        - hour
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    AllowedCompletionPolicy:
      type: string
      description: When a scheduled event is allowed to be completed
      enum:
        - sameDay
        - afterStart
        - sameDayAfterStart
        - duringEvent
        - anytime

    # ── Components — Informational ────────────────────────────────────────

    InformationalContent:
      type: object
      description: Content for a single locale in an informational component
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: The title of the informational component
        lede:
          type: string
          description: A short introductory text or subtitle
        content:
          type: string
          description: The main content text

    InformationalComponentData:
      type: object
      description: Localized informational content keyed by locale (e.g., "en-US", "de-DE")
      additionalProperties:
        $ref: '#/components/schemas/InformationalContent'
      examples:
        - en-US:
            title: 'Welcome'
            lede: 'Introduction to the study'
            content: 'Welcome to the study'
          de-DE:
            title: 'Willkommen'
            lede: 'Einführung in die Studie'
            content: 'Willkommen zur Studie'

    InformationalComponentInput:
      type: object
      description: Request body for creating or updating an informational component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/InformationalComponentData'

    InformationalComponentResponse:
      type: object
      description: Response containing informational component with ID and name
      required:
        - id
        - name
        - data
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/InformationalComponentData'

    # ── Components — Questionnaire ────────────────────────────────────────

    QuestionnaireContent:
      type: object
      description: >
        One FHIR Questionnaire holding its base language and every translation.
        The server stores, publishes and exports these exact bytes.
      required:
        - questionnaire
      properties:
        questionnaire:
          type: string
          description: >
            FHIR Questionnaire JSON. `Questionnaire.language` names the base language;
            other languages are standard `translation` extensions on the displayed strings.
      examples:
        - questionnaire: '{"resourceType": "Questionnaire", "language": "en-US", "title": "Daily Survey", "_title": {"extension": [{"url": "http://hl7.org/fhir/StructureDefinition/translation", "extension": [{"url": "lang", "valueCode": "de"}, {"url": "content", "valueString": "Tägliche Umfrage"}]}]}}'

    QuestionnaireComponentInput:
      type: object
      description: Request body for creating or updating a questionnaire component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/QuestionnaireContent'

    QuestionnaireComponentResponse:
      type: object
      description: >
        Questionnaire component with the languages found in its resource. A draft
        resource is not validated; publication validation checks it.
      required:
        - id
        - name
        - data
        - translationLanguages
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/QuestionnaireContent'
        language:
          type: string
          description: The resource's base language (`Questionnaire.language`), as written. Omitted when the draft names none.
        translationLanguages:
          type: array
          uniqueItems: true
          description: Languages of the resource's translation extensions, as written and sorted.
          items:
            type: string

    # ── Components — Health Data ──────────────────────────────────────────

    ExportSessionStartDate:
      description: >
        Defines how the start date of an export session is determined.
        This represents a strategy rather than a concrete date.
      oneOf:
        - $ref: '#/components/schemas/OldestSampleStartDate'
        - $ref: '#/components/schemas/RelativeStartDate'
        - $ref: '#/components/schemas/AbsoluteStartDate'
      discriminator:
        propertyName: type
        mapping:
          oldestSample: '#/components/schemas/OldestSampleStartDate'
          last: '#/components/schemas/RelativeStartDate'
          absolute: '#/components/schemas/AbsoluteStartDate'

    OldestSampleStartDate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [oldestSample]
      additionalProperties: false
      description: >
        Uses the oldest available sample as the start date.

    RelativeStartDate:
      type: object
      required:
        - type
        - components
      properties:
        type:
          type: string
          enum: [last]
        components:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false
      description: >
        Uses a calendar-relative offset from the time the session was created.

    AbsoluteStartDate:
      type: object
      required:
        - type
        - date
      properties:
        type:
          type: string
          enum: [absolute]
        date:
          type: string
          format: date-time
      additionalProperties: false
      description: >
        Uses a fixed absolute date as the start date.

    HealthDataComponentData:
      type: object
      description: A health data component for collecting health metrics
      required:
        - sampleTypes
      properties:
        sampleTypes:
          $ref: '#/components/schemas/SampleTypesCollection'
        historicalDataCollection:
          type: object
          description: Configuration for collecting historical health data
          properties:
            enabled:
              type: boolean
              default: false
            startDate:
              $ref: '#/components/schemas/ExportSessionStartDate'

    HealthDataComponentInput:
      type: object
      description: Request body for creating or updating a health data component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/HealthDataComponentData'

    HealthDataComponentResponse:
      type: object
      description: Response containing health data component with ID and name
      required:
        - id
        - name
        - data
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/HealthDataComponentData'

    # ── Invitation Codes ───────────────────────────────────────────────

    InvitationCodeResponse:
      type: object
      description: An invitation code for a study
      required:
        - id
        - studyId
        - code
        - used
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        code:
          type: string
        used:
          type: boolean
        enrollmentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    InvitationCodeCreateInput:
      type: object
      description: Request body for generating invitation codes
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of invitation codes to generate
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration date for the generated codes

    # ── Enrollments ────────────────────────────────────────────────────

    EnrollmentResponse:
      type: object
      description: An enrollment in a study
      required:
        - id
        - studyId
        - participantId
        - currentRevision
        - stateVersion
        - enrolledAt
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        currentRevision:
          type: integer
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic enrollment concurrency version; independent of the adopted study revision.
        enrolledAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Exclusive enrollment end retained when joining; independent of withdrawal and historical measurement ranges.
        withdrawnAt:
          type: string
          format: date-time

    # ── Participant ────────────────────────────────────────────────────

    PublishedStudyListItem:
      type: object
      description: Summary of a published study for participant browsing
      required:
        - studyId
        - revision
        - metadata
        - enrollmentConditions
      properties:
        studyId:
          type: string
          format: uuid
          description: The study ID
        revision:
          type: integer
          minimum: 1
          description: The latest published revision number
        metadata:
          $ref: '#/components/schemas/StudyMetadataCodable'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    StudyMetadataCodable:
      description: >
        Study metadata as GroveStudyDefinition.StudyDefinition.Metadata.
        Mapped via typeOverride; the wire format matches Swift's auto-synthesized Codable output.
      type: object
      additionalProperties: true

    EnrollInput:
      type: object
      description: Optional request body for enrolling in a study
      properties:
        invitationCode:
          type: string
          description: Optional invitation code for studies that require one

    # ── Consent Schemas ──────────────────────────────────────────────────

    ConsentContent:
      type: object
      description: Localized consent form content (title and markdown body)
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
          description: Consent document markdown

    StudyConsent:
      type: object
      description: Locale-keyed map of consent content
      additionalProperties:
        $ref: '#/components/schemas/ConsentContent'
      examples:
        - en-US:
            title: Study Consent Form
            content: "# Consent\n\nBy participating..."
          de-DE:
            title: Einwilligungserklärung
            content: "# Einwilligung\n\nDurch die Teilnahme..."

    NameComponents:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string

    SignatureData:
      type: object
      required:
        - name
        - signature
        - size
      properties:
        name:
          $ref: '#/components/schemas/NameComponents'
        signature:
          type: string
          description: Base64-encoded PKDrawing data
        size:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: '[width, height] in points'

    UserResponses:
      type: object
      properties:
        toggles:
          type: object
          additionalProperties:
            type: boolean
        selects:
          type: object
          additionalProperties:
            type: string
        signatures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SignatureData'

    ConsentPresentationReference:
      type: object
      description: Identity of the exact localized Markdown reviewed by the participant, not a claim that the client rendered or understood it.
      required:
        - presentationId
        - locale
        - digest
      properties:
        presentationId:
          type: string
          format: uuid
        locale:
          type: string
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the exact UTF-8 Markdown returned by the server.

    ConsentPresentationResponse:
      type: object
      required:
        - presentation
        - revision
        - markdown
        - enrollmentStateVersion
        - enrollmentETag
      properties:
        presentation:
          $ref: '#/components/schemas/ConsentPresentationReference'
        revision:
          type: integer
          minimum: 1
        markdown:
          type: string
          description: Exact retained Markdown; clients must not substitute a current draft or another locale.
        enrollmentStateVersion:
          type: integer
          format: int64
          minimum: 1
        enrollmentETag:
          type: string
          description: Strong enrollment state tag to submit unchanged as If-Match.

    ConsentRecordResponse:
      type: object
      description: A submitted consent record
      required:
        - id
        - enrollmentId
        - revision
        - userResponses
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        revision:
          type: integer
        userResponses:
          $ref: '#/components/schemas/UserResponses'
        presentation:
          $ref: '#/components/schemas/ConsentPresentationReference'
        acceptedEnrollmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: Immutable version at acceptance, not the current enrollment state. Absent for historical records.
        createdAt:
          type: string
          format: date-time
          description: When the consent was submitted

    GenderIdentity:
      type: string
      description: Self-identified gender identity
      enum:
        - female
        - male
        - transgender
        - nonBinary
        - preferNotToState

    ParticipantProfile:
      type: object
      description: The authenticated participant's profile
      required:
        - id
        - firstName
        - lastName
        - email
        - gender
        - dateOfBirth
        - region
        - language
        - phoneNumber
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 200
        lastName:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        gender:
          $ref: '#/components/schemas/GenderIdentity'
        dateOfBirth:
          type: string
          format: date
        region:
          type: string
          maxLength: 10
        language:
          type: string
          maxLength: 10
        phoneNumber:
          type: string
          maxLength: 30

    ParticipantProfileInput:
      type: object
      description: Input for creating or updating the participant's profile
      required:
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - region
        - language
        - phoneNumber
      properties:
        firstName:
          type: string
          maxLength: 200
        lastName:
          type: string
          maxLength: 200
        gender:
          $ref: '#/components/schemas/GenderIdentity'
        dateOfBirth:
          type: string
          format: date
        region:
          type: string
          maxLength: 10
        language:
          type: string
          maxLength: 10
        phoneNumber:
          type: string
          maxLength: 30
