openapi: 3.1.0
info:
  title: Trove API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v0

security:
  - bearerAuth: []

paths:
  /collection-capabilities:
    get:
      operationId: getCollectionCapabilities
      tags:
        - Studies
      summary: List implemented native collection capabilities
      description: >-
        Describes the native acquisition and receiver capabilities enabled by this deployment.
        Guide inventory membership alone does not enable collection. Provider capabilities are
        separately qualified by an approved provider registration; this list grants no authority.
      responses:
        '200':
          description: Native collection capabilities
          content:
            application/json:
              schema:
                type: array
                maxItems: 512
                items:
                  $ref: '#/components/schemas/CollectionCapability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /groups:
    get:
      tags:
        - Groups
      summary: List all groups (synced from Keycloak)
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get a group by ID
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/studies:
    get:
      tags:
        - Studies
      summary: List all studies in a group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of studies with ID and title
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Studies
      summary: Create a study in a group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyCreateInput'
      responses:
        '201':
          description: Study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Studies
      summary: Get a study by ID
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: Study found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Studies
      summary: Partially update a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPatchInput'
      responses:
        '200':
          description: Study updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

    delete:
      tags:
        - Studies
      summary: Delete an unpublished study without enrollment records
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      responses:
        '204':
          description: Study deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/delegations:
    post:
      operationId: createStudyDelegation
      tags: [Studies]
      summary: Grant a registered client scoped draft access
      description: >
        The grantor is the authenticated researcher. This first version binds the
        delegated OAuth client to that same subject and never grants publication,
        participant data, credentials or onward delegation. Grant metadata is not
        a credential. Expiry must be within the next 24 hours.
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyDelegationInput'
      responses:
        '201':
          description: Committed and audited grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegation'
        default:
          $ref: '#/components/responses/OperationFailure'
    get:
      operationId: listStudyDelegations
      tags: [Studies]
      summary: List a bounded page of visible study grants
      description: Administrators can inspect all study grants; other researchers can inspect only their own.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: before
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Authorized page after committed disclosure intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegationPage'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/delegations/{delegationId}/revoke:
    post:
      operationId: revokeStudyDelegation
      tags: [Studies]
      summary: Revoke a study grant
      description: >
        Revocation and protected draft operations use the same database ordering
        boundary. Later operations are denied. A retry returns the original
        revocation time. This does not retract data already delivered.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked grant with stable revocation time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegation'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/data:
    get:
      operationId: getStudyData
      tags: [Studies]
      summary: Read an authorized page of derived study data
      description: >
        Requires interactive researcher identity, researcher or admin membership,
        and explicit data-reader membership in the study's group. Admin and
        audit-reader membership alone do not authorize clinical data access.
        Selects each granted point output once, with current versions by default.
        History includes superseded versions with isCurrent false; neither mode
        includes withdrawn or retracted data. Enrollment end alone preserves history.
        Each record is a derived FHIR collection Bundle with exact clinical numeric
        tokens, study-specific subject/context and derivation Provenance. It is not
        the original custody Bundle. Original profile names describe source lineage,
        not conformance claims for derived resources. Records are Base64 encoded to
        prevent JSON clients from rounding FHIR numeric values.
        The server holds the current-authority fence through committed disclosure
        intent. A page contains up to 100 records and 1024 outputs, without splitting a record.
        The configured response budget defaults to 24 MiB and cannot exceed 96 MiB of encoded response data;
        a byte-capacity failure returns no partial page. Request fewer records to reduce
        page size. before is an opaque cursor scoped to this study and version view,
        not an authorization token. Changed eligibility can require restarting from
        the first page. Newly attributed historical data also requires a fresh first
        page. This is a live view, not a frozen dataset snapshot.
        Device unit identifiers are withheld from a record unless every grant of this
        study for the record comes from a publication that receives them; the
        derivation Provenance then names the withholding policy.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          schema:
            type: string
            format: uuid
        - name: versions
          in: query
          schema:
            $ref: '#/components/schemas/StudyDataVersions'
      responses:
        '200':
          description: Derived study data after committed disclosure intent
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDataPage'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/data/recordings/{grantId}:
    get:
      operationId: getStudyRecording
      tags: [Studies]
      summary: Download an authorized recording's original source bytes
      description: >
        Requires the same interactive researcher membership and explicit data-reader
        capability as study data pages. The grant identifier is an exact study grant
        from export Provenance, not an authorization token. Current and history
        selection exclude withdrawn and retracted data. The server checks authority
        before storage access and again after preparing the complete verified file,
        then commits disclosure intent before returning any bytes. The response is
        the original decoded source bytes in binary transport, matching its FHIR hash and size even
        when the stored transport representation is compressed. X-Recording-Content-Type preserves the validated original attachment media type. Transfer expiry does
        not expire retained clinical custody. Storage, integrity or configured
        capacity failures return no partial successful response and can be retried.
        A native, provider or FHIR collection recording returns 403 unless every grant
        of this study for the record comes from a publication that receives device
        unit identifiers.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versions
          in: query
          schema:
            $ref: '#/components/schemas/StudyDataVersions'
      responses:
        '200':
          description: Complete verified source recording after committed disclosure intent
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
            Content-Disposition:
              required: true
              schema:
                type: string
            X-Recording-Content-Type:
              required: true
              description: Original attachment media type validated against its registered Grove recording format, URI-component encoded by the OpenAPI simple header representation. Decode exactly once before interpreting the media type. The response body uses binary transport to preserve source bytes.
              schema:
                type: string
                enum:
                  - text/csv
                  - application/json
                  - application/octet-stream
                  - application/fhir+json
                  - 'application/fhir+json; fhirVersion=1.0'
                  - 'application/fhir+json; fhirVersion=4.0'
                  - application/hl7-cda+xml
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/audit-events:
    get:
      tags: [Studies]
      summary: Read a bounded page of study audit history
      description: >
        Requires researcher identity plus both admin and audit-reader membership
        in the study's group. Administration alone does not grant audit access.
        Includes only that study's group-scoped history, never participant/source history.
        Ordered by occurredAt and id descending. A cursor is an existing event ID in
        the same scope, not an authorization token. Each page requires committed
        disclosure intent before release; identifiers remain governed study data.
        New records require a fresh first page; this is not a frozen export snapshot.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized study audit page
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /studies/{studyId}/draft/validations:
    post:
      operationId: validateStudyDraft
      tags: [Studies]
      summary: Validate an exact study draft for publication
      description: >
        Captures the complete draft, validates every multilingual Questionnaire against
        the pinned Grove FHIR IG and execution capabilities, and stages the exact
        publication archive. Findings that prevent publication are returned as
        blockers, other findings as advisories. Only a `valid` result creates a
        candidate: its ID identifies a single immutable candidate and is also its future
        publication ID. An `invalid`, `incomplete` or `unavailable` result has no
        candidate and cannot be published. Candidates expire within one hour, or earlier
        when Questionnaire eligibility ends. This operation does not publish. Changes
        during validation reject the result without accepting a candidate. Provider
        registration and publication preparation failures, such as invalid consent
        response controls, remain problem responses.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/DelegationId'
      responses:
        '201':
          description: Exact draft validated and staged as a candidate for explicit review and publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDraftValidation'
        '200':
          description: No candidate was created; the blockers state why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDraftValidation'
        default:
          $ref: '#/components/responses/OperationFailure'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /studies/{studyId}/publish:
    post:
      tags:
        - Studies
      summary: Publish a study
      description: >
        Accepts only the immutable candidate selected by validationId and its original
        If-Match draft revision. Requires fresh interactive administrator authority;
        delegated clients cannot publish. First acceptance checks current draft,
        candidate lifetime, validator identity, capabilities and next publication revision.
        It retains the previously validated archive without rebuilding it. An exact
        authorized retry returns the same publication even if the draft later changes
        or the candidate expires. A different If-Match never aliases an accepted request.
        An unavailable validator blocks new validation; an unexpired proof with unchanged
        pins remains usable without a second validator request. All candidates, including
        studies without Questionnaires, require a configured pinned validator identity.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPublicationInput'
      responses:
        '201':
          description: Study published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedStudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/OperationFailure'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /studies/{studyId}/published:
    get:
      tags:
        - Studies
      summary: List published revisions of a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of published revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedStudyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/invitation-codes:
    get:
      tags:
        - Invitation Codes
      summary: List invitation codes for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of invitation codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Invitation Codes
      summary: Generate new invitation codes for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCodeCreateInput'
      responses:
        '201':
          description: Invitation codes generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/invitation-codes/{codeId}:
    delete:
      tags:
        - Invitation Codes
      summary: Delete an invitation code
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/CodeId'
      responses:
        '204':
          description: Invitation code deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /studies/{studyId}/enrollments:
    get:
      tags:
        - Studies
      summary: List enrollments for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/components:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: List all components for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Component'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/components/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    delete:
      tags:
        - Components
      summary: Remove a component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '204':
          description: Component deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/components/{componentId}/validations:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      operationId: validateStudyComponent
      tags:
        - Components
      summary: Validate a questionnaire component's stored resource
      description: >
        Validates the exact stored Questionnaire against the pinned Grove FHIR IG with the
        official FHIR Validator, the IG's Questionnaire rules, and the execution
        capabilities of the supported study client. Returns every finding with its
        severity, rule, element path and, for a translation, its language. Only `valid`
        means that no finding is an error and no check was reported as skipped. The
        result is not stored, does not change the draft and is not publication evidence;
        publication requires draft validation.
        Other component types return 422.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: Validation result for the stored resource at the returned draft revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireValidation'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Informational Components ──

  /studies/{studyId}/components/informational:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags:
        - Components
      summary: Add an informational component to a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationalComponentInput'
      responses:
        '201':
          description: Component added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/components/informational/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: Get a single informational component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: The informational component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Components
      summary: Replace an informational component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationalComponentInput'
      responses:
        '200':
          description: Component replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Questionnaire Components ──

  /studies/{studyId}/components/questionnaire:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags:
        - Components
      summary: Add a questionnaire component to a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
