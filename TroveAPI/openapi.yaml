  /participant/enrollments/{enrollmentId}/collection-plan:
    get:
      operationId: getParticipantCollectionPlan
      tags:
        - Participant
      summary: Read exact consented collection windows for an owned enrollment
      description: >
        Returns an audited, consistent snapshot of accepted consent windows and
        their published collection requirements. No consent responses, signatures,
        artifacts or samples are returned. Withdrawal or no accepted consent yields
        no windows. Publication alone does not change the timeline. Inconsistent
        history or unknown policy fails the whole read, never a partial plan.
        Retain a complete, account-bound set of accepted plans for offline collection
        until each enrollment ends. Observation time is not an expiration and no
        elapsed-time lease or per-page network authorization is required. Enforce
        local withdrawal, account changes, known source revocation and known
        enrollment end. Refresh on reconnect and enrollment or consent changes;
        initial consent and broader revision adoption require server authorization.
        A retained plan is not an upload capability: the receiver independently
        checks every submitted target against its original consent and revision.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Exact collection plan, or an empty plan when collection is not allowed
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantCollectionPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/enrollments/{enrollmentId}/collection-reconciliations:
    post:
      operationId: requestParticipantCollectionReconciliations
      tags:
        - Participant
      summary: Request current instructions for finite sweeps of ended sleep and workout windows
      description: >
        Participant and installation authenticated. A sleep or workout session that
        overlaps an accepted collection window can be finalized after the enrollment
        ended. For an ended, not withdrawn enrollment this returns one instruction per
        closed accepted sleep, workout or opted-in workout-route window whose sweep is
        unfinished, after checking current withdrawal, source ownership and an active
        installation. Each instruction fixes the original window and carries a short
        lease; a repeated request renews unfinished sweeps under the same identity and
        never returns a completed one. An instruction never extends the cached
        collection plan, opens a new measurement window or authorizes upload.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/SourceInstallationID'
        - $ref: '#/components/parameters/SourceInstallationProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeCollectionReconciliationRequest'
      responses:
        '200':
          description: Current instructions, excluding completed sweeps; empty when nothing is eligible
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeCollectionReconciliationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/enrollments/{enrollmentId}/collection-reconciliations/{reconciliationId}/complete:
    post:
      operationId: completeParticipantCollectionReconciliation
      tags:
        - Participant
      summary: Acknowledge a durably completed sweep
      description: >
        Idempotent. Records that the installation exhausted the instruction's bounded
        query. It does not assert upload or historical completeness: queued records
        and receipt recovery remain independent, and a completed sweep is never issued
        again for the same source and window.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SourceInstallationID'
        - $ref: '#/components/parameters/SourceInstallationProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeCollectionReconciliationRequest'
      responses:
        '204':
          description: Completion retained, including an identical retry
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/enrollments/{enrollmentId}/consent-presentation:
    get:
      tags:
        - Participant
      summary: Read the exact consent presentation for an active enrollment
      description: >
        Returns retained Markdown for the exact locale and explicitly selected current or forward revision.
        Omitting revision selects the enrollment's current revision, never the latest publication.
        Every forward adoption requires fresh consent, even when its text is unchanged.
        Historical publications without a retained presentation cannot accept new consent.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: locale
          in: query
          required: true
          schema:
            type: string
          description: Exact published locale identifier; no language fallback is applied.
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Exact published current or forward revision to review; omitted means the enrollment's current revision.
      responses:
        '200':
          description: Immutable consent presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPresentationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /participant/enrollments/{enrollmentId}/consents:
    get:
      tags:
        - Participant
      summary: List consent records for an enrollment
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: List of consent records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Participant
      summary: Submit a consent record
      description: >
        Requires Idempotency-Key and If-Match. Exact authorized replay returns the
        original receipt before checking current enrollment state, including after
        withdrawal; it never restores access. Reusing a key with changed content
        or expected version conflicts. A new command requires the current active
        enrollment version and exact reviewed presentation. An explicit forward
        reviewedRevision requires fresh consent and target eligibility; consent,
        revision adoption, enrollment version and audit are committed together.
        Later publication cannot select an unseen revision. Downgrades are rejected.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID scoped to this enrollment; reuse the same key and complete command when retrying.
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Exact strong enrollmentETag from the presentation response. Weak, wildcard and multiple tags are not accepted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - consentData
                - consentPDF
                - reviewedRevision
                - presentation
              properties:
                presentation:
                  $ref: '#/components/schemas/ConsentPresentationReference'
                reviewedRevision:
                  type: integer
                  minimum: 1
                  description: Exact published current or forward study revision presented to the participant; never implicitly replaced by the latest revision.
                consentData:
                  $ref: '#/components/schemas/UserResponses'
                consentPDF:
                  type: string
                  format: binary
            encoding:
              presentation:
                contentType: application/json
              reviewedRevision:
                contentType: application/json
              consentData:
                contentType: application/json
              consentPDF:
                contentType: application/pdf
      responses:
        '201':
          description: Consent record created, or the original record returned for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '412':
          $ref: '#/components/responses/PreconditionFailed'

