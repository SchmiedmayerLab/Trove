    put:
      tags:
        - Participant
      summary: Update the authenticated participant's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantProfileInput'
      responses:
        '200':
          description: The updated participant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources:
    post:
      tags:
        - Participant
      summary: Register an installation against the participant's logical source
      description: >
        Requires a verified participant profile. Persist a fresh registrationID
        and random 256-bit installation credential before the first request.
        Retries with the same repository and credential return the retained
        registration, including revocation. Reusing a nonce with a different
        credential or repository is rejected. Authorized installations for the
        same participant and repository share one server-provisioned logical
        source, key ID, epoch and namespace. Registration grants no study access
        and does not attest the data origin. Missing or unverifiable retained
        identity state never creates replacement identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [registrationID, repositoryKind, credentialBase64]
              properties:
                registrationID:
                  type: string
                  format: uuid
                repositoryKind:
                  $ref: '#/components/schemas/NativeSourceRepository'
                credentialBase64:
                  $ref: '#/components/schemas/SourceInstallationCredential'
      responses:
        '200':
          description: The logical source and independently revocable installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSourceRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/OperationFailure'

  /participant/source-installations/{registrationId}:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getParticipantSourceInstallation
      tags: [Participant]
      summary: Restore an account-owned installation's public registration state
      responses:
        '200':
          description: Retained source and installation state, including revocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSourceRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/source-installations/{registrationId}/revoke:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeParticipantSourceInstallation
      tags: [Participant]
      summary: Permanently revoke one account-owned installation
      description: >
        Idempotent. The verified owner may revoke a lost installation without its
        credential. Other installations and the logical source remain active.
        This does not withdraw enrollment, retract source records or erase data.
      responses:
        '200':
          description: Retained source and revoked installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSourceRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/source-installations/{registrationId}/identity:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: recoverParticipantSourceIdentity
      tags: [Participant]
      summary: Recover the complete logical-source identity for an active installation
      description: >
        Requires both verified participant ownership and the installation
        credential. The server commits a disclosure-intent audit event before
        returning the source identity key. Keep the response out of logs, caches
        and exports. The derivation key is independent of installation credentials
        and optional signing keys. Unavailable key-encryption material or corrupt
        retained state returns an explicit failure without minting a replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credentialBase64]
              properties:
                credentialBase64:
                  $ref: '#/components/schemas/SourceInstallationCredential'
      responses:
        '200':
          description: The retained registration and its participant identity key
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSourceIdentityRecovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/OperationFailure'

  /participant/sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Participant
      summary: Get an app data stream owned by the authenticated participant
      responses:
        '200':
          description: The participant-owned stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources/{sourceId}/revoke:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Participant
      summary: Permanently revoke a participant-owned app data stream
      description: >
        Idempotent. Revocation prevents future admission from this stream; it
        neither deletes retained data nor changes enrollment or study access.
      responses:
        '200':
          description: The revoked stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources/{sourceId}/recording-transfers/{transferId}/declaration:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: declareParticipantRecordingTransfer
      tags:
      - Participant
      summary: Register an immutable recording transfer declaration
      description: Requires current participant source ownership, installation proof and collection authority. Persist
        a transfer UUID and the unchanged declaration before sending. Replays return the same declaration commitment;
        changing it under the same source/UUID returns 409. The JSON envelope is limited to 64 KiB. Registration is
        audited and does not store recording bytes, accept a clinical record or create study grants. Retain the declaration
        commitment for matching upload and recovery receipts. Workout consent alone does not authorize route collection.
      parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingTransferDeclaration'
      responses:
        '200':
          description: Register an immutable recording transfer declaration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingTransferRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '413':
          description: Declaration or recording exceeds its configured budget
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Interrupted request; retry unchanged declaration and bytes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /participant/sources/{sourceId}/recording-transfers/{transferId}/content:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: uploadParticipantRecordingTransfer
      tags:
      - Participant
      summary: Stream the exact bytes of a registered recording transfer
      description: Send application/octet-stream with Content-Length equal to storedByteCount. For zstd, send the
        declared Zstandard frame without an HTTP Content-Encoding header. Current source/installation and collection
        authority are checked before body consumption and before issuing a receipt. Stored count and SHA-256 are verified
        by readback. An active attempt returns 409; failed attempts can be retried and crashed attempts expire. Late
        attempts cannot replace newer uploads. Recover a lost response before resending bytes. This receipt attests
        stored transport bytes only, not decoded-source validity, FHIR admission or researcher access. Keep the source
        recording until its clinical record has a custody receipt.
      parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stream the exact bytes of a registered recording transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingTransferReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '413':
          description: Declaration or recording exceeds its configured budget
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Interrupted request; retry unchanged declaration and bytes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /participant/sources/{sourceId}/recording-transfers/{transferId}/receipt:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: lookupParticipantRecordingTransferReceipt
      tags:
      - Participant
      summary: Recover the latest completed recording transfer receipt
      description: Requires participant source ownership and a committed disclosure audit. Works after withdrawal
        or source revocation without admitting bytes or restoring access. Returns 404 when the latest attempt has
        no committed receipt or the source is not owned. Match the source/transfer identity, retained declaration
        commitment and stored byte count/digest. expiresAt bounds attachment acceptance; an expired receipt proves
        the past transfer, not current retention.
      responses:
        '200':
          description: Recover the latest completed recording transfer receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingTransferReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/event-receipts/lookup:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: lookupParticipantEventReceipt
      tags:
        - Participant
      summary: Recover an immutable receipt for an event owned by the participant
      description: >
        Matches an accepted representation by event identifier, payload digest and exact consent/output intent.
        Works after source revocation or enrollment withdrawal without admitting data,
        restoring access or returning samples. Requires source ownership and a committed
        audit disclosure intent. An unknown or foreign-owned event or an unaccepted payload digest returns 404;
        a different consent/output intent returns 409. Unknown bytes must be submitted for validation.
        A receipt proves past custody only; clients must match its identity and digest
        to their staged bytes before retirement. The JSON request is limited to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReceiptLookup'
      responses:
        '200':
          description: Original persisted custody receipt; never current study access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Lookup request exceeds 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/events/{eventId}/attributions:
    parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: attributeParticipantEvent
      tags: [Participant]
      summary: Authorize additional exact-version study outputs without copying the event
      description: >
        Requires participant source ownership and independently eligible exact consent
        targets. Never changes event bytes, original submission intent or current
        revision selection. New grants require active enrollment, source and installation, including
        for historical measurements. Pre-consent collection is not implicitly eligible.
        Each command is atomic and idempotent within its source. Exact command retries
        return the original outcome even after withdrawal or revocation; changed event
        or targets conflict. An unknown or foreign-owned event returns 404. No samples
        are returned. JSON requests are limited to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAttribution'
      responses:
        '200':
          description: Original command receipt; not current study access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAttributionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Attribution request exceeds 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/events:
    parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Participant
      summary: Admit one validated collection or source-retraction event
      description: >
        The server validates the original bytes against its pinned Grove FHIR
        contract, then independently checks each named immutable consent and its
        collection interval and policy. Adoption of a later study revision does not
        relabel delayed measurements. Every retained clinical output requires coverage
        by a named consent; only explicitly selected outputs receive that study's grant.
        A source retraction requires an empty target list and creates no study grants.
        It requires an authenticated, active source and installation but no active enrollment.
        It suppresses every output of every version of the source record, including later arrivals,
        without deleting retained evidence or affecting other sources. The first accepted retraction
        retains its lifecycle effect when another report repeats its record-retraction identity.
        Event, point indexes or retraction assertions, study grants and audit commit together.
        The same event bytes and consent/output intent return
        the original receipt without creating new grants. Equivalent JSON serialization and changed
        enrollment snapshots outside the clinical version may be retained as additional byte representations
        under the same event ID, with their own payload digest, receipt time and node count. New representations
        require current collection authority; they create no additional clinical facts or study grants.
        Changed clinical resource tokens, a changed body under a retained snapshot key, or different
        consent/output intent under an existing version identity is a conflict. The receipt records
        acceptance, not current permission to access study data. Initially supports
        immutable, single-participant heart-rate and body-weight point quantities, sleep-stage intervals, complete workout sessions with segments, and whole-source-record retractions; unsupported valid FHIR
        shapes are rejected explicitly. No clinical payload is returned. The JSON
        envelope budget defaults to 6 MiB (hard ceiling 24 MiB), original event bytes
        to 4 MiB (hard ceiling 16 MiB), and normalized target intent to 512 KiB. Base64 preserves exact producer bytes; the server
        never reconstructs the event from decoded FHIR JSON. Sets are order-independent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubmission'
      responses:
        '200':
          description: Immutable event acceptance receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Event exceeds the admission size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid Grove FHIR event or unsupported receiver shape
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Pinned validation service is unavailable
          headers:
            Retry-After:
              description: Earliest retry time, as delay seconds or an HTTP date
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /participant/sources/{sourceId}/events/batch:
    parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: submitParticipantEventBatch
      tags: [Participant]
      summary: Admit a bounded batch with independent event outcomes
      description: >
        Submit 1–16 original event submissions for one owned active source.
        Authentication and envelope bounds precede processing. The JSON envelope
        budget defaults to 6 MiB (hard ceiling 24 MiB). The sum of eventBase64 UTF-8
        lengths is bounded by the configured record-byte budget after Base64 expansion,
        with a hard ceiling of 22369624 bytes.
        Each member retains the single-event validation, consent and size limits.
        The response has one receipt or sanitized problem per member in input order.
        Members commit independently and are processed sequentially. One rejection
        does not roll back another event. Cancellation or a lost response may leave
        accepted members; recover each original receipt before retrying unchanged
        bytes and targets. A receipt is custody evidence, not current study access.
        This is not a background job or a latency guarantee. No clinical payload is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatchSubmission'
      responses:
        '200':
          description: One independent outcome per submitted event, in input order
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  $ref: '#/components/schemas/EventBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Batch exceeds the request size limit; no member was processed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/record-bundles:
    parameters:
      - $ref: '#/components/parameters/SourceInstallationID'
      - $ref: '#/components/parameters/SourceInstallationProof'
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: submitParticipantRecordBundle
      tags: [Participant]
      summary: Admit a Grove Bundle with independent record outcomes
      description: >
        Submit one Grove active or retraction Bundle for one owned active source, with
        1–16 record commitments in response order. Active records and retractions cannot mix.
        Shared entries travel once. Each commitment names the original staged record's
        ordered entry addresses, exact payload digest and study targets. The receiver
        reconstructs and validates that record before independently committing it.
        The configured JSON envelope budget defaults to 6 MiB (hard ceiling 24 MiB),
        the decoded Bundle budget to 4 MiB plus 1 KiB (hard ceiling 16 MiB plus 1 KiB),
        and each restored record budget to 4 MiB (hard ceiling 16 MiB).
        A malformed Bundle or a mismatch between its lifecycle records and the commitment
        list rejects the envelope before admission. Record-level validation or authorization
        failures do not roll back accepted siblings. Receipts commit the original record
        bytes, not the transport Bundle's timestamp, grouping or entry order. Recover each
        uncertain receipt before retrying; remaining records may be packed differently.
        Transport-only framing and rejected records are not retained as accepted custody.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordBundleSubmission'
      responses:
        '200':
          description: One independent outcome per submitted event, in input order
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  $ref: '#/components/schemas/EventBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Batch exceeds the request size limit; no member was processed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid Grove exchange graph; no record was admitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/studies:
    get:
      tags:
        - Participant
      summary: Browse published studies
      description: >
        Without `studyId`, returns publicly listed studies (visibility = public).
        With `studyId`, returns the matching study even if it is unlisted, allowing
