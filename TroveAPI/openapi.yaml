openapi: 3.1.0
info:
  title: Trove API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v0

security:
  - bearerAuth: []

paths:
  /groups:
    get:
      tags:
        - Groups
      summary: List all groups (synced from Keycloak)
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get a group by ID
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/studies:
    get:
      tags:
        - Studies
      summary: List all studies in a group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of studies with ID and title
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Studies
      summary: Create a study in a group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyCreateInput'
      responses:
        '201':
          description: Study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Studies
      summary: Get a study by ID
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: Study found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Studies
      summary: Partially update a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPatchInput'
      responses:
        '200':
          description: Study updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

    delete:
      tags:
        - Studies
      summary: Delete an unpublished study without enrollment records
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      responses:
        '204':
          description: Study deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/delegations:
    post:
      operationId: createStudyDelegation
      tags: [Studies]
      summary: Grant a registered client scoped draft access
      description: >
        The grantor is the authenticated researcher. This first version binds the
        delegated OAuth client to that same subject and never grants publication,
        participant data, credentials or onward delegation. Grant metadata is not
        a credential. Expiry must be within the next 24 hours.
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyDelegationInput'
      responses:
        '201':
          description: Committed and audited grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegation'
        default:
          $ref: '#/components/responses/OperationFailure'
    get:
      operationId: listStudyDelegations
      tags: [Studies]
      summary: List a bounded page of visible study grants
      description: Administrators can inspect all study grants; other researchers can inspect only their own.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: before
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Authorized page after committed disclosure intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegationPage'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/delegations/{delegationId}/revoke:
    post:
      operationId: revokeStudyDelegation
      tags: [Studies]
      summary: Revoke a study grant
      description: >
        Revocation and protected draft operations use the same database ordering
        boundary. Later operations are denied. A retry returns the original
        revocation time. This does not retract data already delivered.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: delegationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked grant with stable revocation time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDelegation'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/audit-events:
    get:
      tags: [Studies]
      summary: Read a bounded page of study audit history
      description: >
        Requires researcher identity plus both admin and audit-reader membership
        in the study's group. Administration alone does not grant audit access.
        Includes only that study's group-scoped history, never participant/source history.
        Ordered by occurredAt and id descending. A cursor is an existing event ID in
        the same scope, not an authorization token. Each page requires committed
        disclosure intent before release; identifiers remain governed study data.
        New records require a fresh first page; this is not a frozen export snapshot.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized study audit page
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /studies/{studyId}/draft/validations:
    post:
      operationId: validateStudyDraft
      tags: [Studies]
      summary: Validate an exact study draft for publication
      description: >
        Captures the complete draft, validates every localized Questionnaire against
        the pinned Grove FHIR IG and execution capabilities, and stages the exact
        publication archive. The returned validation ID identifies a single immutable
        candidate and is also its future publication ID. Candidates expire within one
        hour, or earlier when Questionnaire eligibility ends. This operation does not
        publish. Changes during validation reject the result without accepting a candidate.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/DelegationId'
      responses:
        '201':
          description: Exact draft validated and staged for explicit review and publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyDraftValidation'
        default:
          $ref: '#/components/responses/OperationFailure'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /studies/{studyId}/publish:
    post:
      tags:
        - Studies
      summary: Publish a study
      description: >
        Accepts only the immutable candidate selected by validationId and its original
        If-Match draft revision. Requires fresh interactive administrator authority;
        delegated clients cannot publish. First acceptance checks current draft,
        candidate lifetime, validator identity, capabilities and next publication revision.
        It retains the previously validated archive without rebuilding it. An exact
        authorized retry returns the same publication even if the draft later changes
        or the candidate expires. A different If-Match never aliases an accepted request.
        An unavailable validator blocks new validation; an unexpired proof with unchanged
        pins remains usable without a second validator request. All candidates, including
        studies without Questionnaires, require a configured pinned validator identity.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPublicationInput'
      responses:
        '201':
          description: Study published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedStudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/OperationFailure'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /studies/{studyId}/published:
    get:
      tags:
        - Studies
      summary: List published revisions of a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of published revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedStudyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/invitation-codes:
    get:
      tags:
        - Invitation Codes
      summary: List invitation codes for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of invitation codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Invitation Codes
      summary: Generate new invitation codes for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCodeCreateInput'
      responses:
        '201':
          description: Invitation codes generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/invitation-codes/{codeId}:
    delete:
      tags:
        - Invitation Codes
      summary: Delete an invitation code
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/CodeId'
      responses:
        '204':
          description: Invitation code deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /studies/{studyId}/enrollments:
    get:
      tags:
        - Studies
      summary: List enrollments for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/components:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: List all components for a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200':
          description: List of components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Component'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /studies/{studyId}/components/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    delete:
      tags:
        - Components
      summary: Remove a component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '204':
          description: Component deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Informational Components ──

  /studies/{studyId}/components/informational:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags:
        - Components
      summary: Add an informational component to a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationalComponentInput'
      responses:
        '201':
          description: Component added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/components/informational/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: Get a single informational component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: The informational component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Components
      summary: Replace an informational component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationalComponentInput'
      responses:
        '200':
          description: Component replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationalComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Questionnaire Components ──

  /studies/{studyId}/components/questionnaire:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags:
        - Components
      summary: Add a questionnaire component to a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireComponentInput'
      responses:
        '201':
          description: Component added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/components/questionnaire/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: Get a single questionnaire component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: The questionnaire component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireComponentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Components
      summary: Replace a questionnaire component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireComponentInput'
      responses:
        '200':
          description: Component replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Health Data Components ──

  /studies/{studyId}/components/health-data:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags:
        - Components
      summary: Add a health data component to a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthDataComponentInput'
      responses:
        '201':
          description: Component added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDataComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  /studies/{studyId}/components/health-data/{componentId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Components
      summary: Get a single health data component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: The health data component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDataComponentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Components
      summary: Replace a health data component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthDataComponentInput'
      responses:
        '200':
          description: Component replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDataComponentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/OperationFailure'

  # ── Schedules ──

  /studies/{studyId}/components/{componentId}/schedules:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    get:
      tags:
        - Schedules
      summary: List all schedules for a component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/ComponentId'
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Schedules
      summary: Add a schedule to a component
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentScheduleInput'
      responses:
