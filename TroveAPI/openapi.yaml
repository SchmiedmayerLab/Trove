  # ── Participant ──────────────────────────────────────────────────────

  /participant/profile:
    get:
      tags:
        - Participant
      summary: Get the authenticated participant's profile
      responses:
        '200':
          description: The participant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Participant
      summary: Create the authenticated participant's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantProfileInput'
      responses:
        '201':
          description: Participant profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    put:
      tags:
        - Participant
      summary: Update the authenticated participant's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantProfileInput'
      responses:
        '200':
          description: The updated participant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources:
    post:
      tags:
        - Participant
      summary: Register a participant-owned app data stream
      description: >
        Requires an existing participant profile. A registrationID is an
        idempotency key scoped to that participant. Repeating it returns the same
        stream, including its revoked state; it never reactivates a stream.
        Registration grants no study access and does not attest the data origin.
        The server assigns all identity namespaces. Preserve the event sequence
        and exact retry bytes across restarts; register a new stream if that
        journal is lost, including after reinstalling the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - registrationID
              properties:
                registrationID:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The registered stream, or the original result of a retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Participant
      summary: Get an app data stream owned by the authenticated participant
      responses:
        '200':
          description: The participant-owned stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources/{sourceId}/revoke:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Participant
      summary: Permanently revoke a participant-owned app data stream
      description: >
        Idempotent. Revocation prevents future admission from this stream; it
        neither deletes retained data nor changes enrollment or study access.
      responses:
        '200':
          description: The revoked stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/sources/{sourceId}/event-receipts/lookup:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: lookupParticipantEventReceipt
      tags:
        - Participant
      summary: Recover an immutable receipt for an event owned by the participant
      description: >
        Matches the original event identifier, payload digest and exact consent/output intent.
        Works after source revocation or enrollment withdrawal without admitting data,
        restoring access or returning samples. Requires source ownership and a committed
        audit disclosure intent. An unknown or foreign-owned event returns 404.
        A receipt proves past custody only; clients must match its identity and digest
        to their staged bytes before retirement. The JSON request is limited to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReceiptLookup'
      responses:
        '200':
          description: Original persisted custody receipt; never current study access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Lookup request exceeds 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/events/{eventId}/attributions:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: attributeParticipantEvent
      tags: [Participant]
      summary: Authorize additional exact-version study outputs without copying the event
      description: >
        Requires participant source ownership and independently eligible exact consent
        targets. Never changes event bytes, original submission intent or current
        revision selection. New grants require active enrollment and source, including
        for historical measurements. Pre-consent collection is not implicitly eligible.
        Each command is atomic and idempotent within its source. Exact command retries
        return the original outcome even after withdrawal or revocation; changed event
        or targets conflict. An unknown or foreign-owned event returns 404. No samples
        are returned. JSON requests are limited to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAttribution'
      responses:
        '200':
          description: Original command receipt; not current study access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAttributionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Attribution request exceeds 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/sources/{sourceId}/events:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Participant
      summary: Admit one validated collection or source-retraction event
      description: >
        The server validates the original bytes against its pinned Grove FHIR
        contract, then independently checks each named immutable consent and its
        collection interval and policy. Adoption of a later study revision does not
        relabel delayed measurements. Every retained clinical output requires coverage
        by a named consent; only explicitly selected outputs receive that study's grant.
        A source retraction requires an empty target list and creates no study grants.
        It requires an authenticated, active source binding but no active enrollment.
        Its source-scoped logical Observation targets suppress every version, including
        later arrivals, without deleting retained evidence or affecting other sources.
        Event, point indexes or retraction assertions, study grants and audit commit together.
        The same event bytes and consent/output intent return
        the original receipt without creating new grants. Reusing an event identity
        with different bytes or consent/output intent is a conflict. The receipt records
        acceptance, not current permission to access study data. Initially supports
        immutable, single-participant point-quantity events and Observation retractions; unsupported valid FHIR
        shapes are rejected explicitly. No clinical payload is returned. The JSON
        envelope is limited to 6 MiB, original event bytes to 4 MiB and normalized
        target intent to 512 KiB. Base64 preserves exact producer bytes; the server
        never reconstructs the event from decoded FHIR JSON. Sets are order-independent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubmission'
      responses:
        '200':
          description: Immutable event acceptance receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Event exceeds the admission size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid Grove FHIR event or unsupported receiver shape
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Pinned validation service is unavailable
          headers:
            Retry-After:
              description: Earliest retry time, as delay seconds or an HTTP date
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /participant/sources/{sourceId}/events/batch:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: submitParticipantEventBatch
      tags: [Participant]
      summary: Admit a bounded batch with independent event outcomes
      description: >
        Submit 1–16 original event submissions for one owned active source.
        Authentication and envelope bounds precede processing. The JSON envelope
        is limited to 6 MiB and the sum of eventBase64 UTF-8 lengths to 5592408 bytes.
        Each member retains the single-event validation, consent and size limits.
        The response has one receipt or sanitized problem per member in input order.
        Members commit independently and are processed sequentially. One rejection
        does not roll back another event. Cancellation or a lost response may leave
        accepted members; recover each original receipt before retrying unchanged
        bytes and targets. A receipt is custody evidence, not current study access.
        This is not a background job or a latency guarantee. No clinical payload is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatchSubmission'
      responses:
        '200':
          description: One independent outcome per submitted event, in input order
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  $ref: '#/components/schemas/EventBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Batch exceeds the request size limit; no member was processed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/studies:
    get:
      tags:
        - Participant
      summary: Browse published studies
      description: >
        Without `studyId`, returns publicly listed studies (visibility = public).
        With `studyId`, returns the matching study even if it is unlisted, allowing
        participants to access private studies they know the ID for.
      parameters:
        - name: studyId
          in: query
          required: false
          description: Look up a specific study by its ID. Required to access unlisted studies.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of published studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedStudyListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /participant/enrollments:
    get:
      tags:
        - Participant
      summary: List my enrollments
      responses:
        '200':
          description: List of enrollments for the authenticated participant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /participant/studies/{studyId}/enrollments:
    post:
      tags:
        - Participant
      summary: Enroll in a study
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollInput'
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /participant/enrollments/{enrollmentId}/withdraw:
    post:
      tags:
        - Participant
      summary: Withdraw from a study
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Successfully withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /participant/enrollments/{enrollmentId}/collection-plan:
    get:
      operationId: getParticipantCollectionPlan
      tags:
        - Participant
      summary: Read exact consented collection windows for an owned enrollment
      description: >
        Returns an audited, consistent snapshot of accepted consent windows and
        their published collection requirements. No consent responses, signatures,
        artifacts or samples are returned. Withdrawal or no accepted consent yields
        no windows. Publication alone does not change the timeline. Inconsistent
        history or unknown policy fails the whole read, never a partial plan.
        This snapshot is not an upload capability or permission for continued
        offline collection. Refresh before collection and after enrollment or
        consent changes; the receiver independently checks every submitted target.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Exact collection plan, or an empty plan when collection is not allowed
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantCollectionPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /participant/enrollments/{enrollmentId}/consent-presentation:
    get:
      tags:
        - Participant
      summary: Read the exact consent presentation for an active enrollment
      description: >
        Returns retained Markdown for the exact locale and explicitly selected current or forward revision.
        Omitting revision selects the enrollment's current revision, never the latest publication.
        Every forward adoption requires fresh consent, even when its text is unchanged.
        Historical publications without a retained presentation cannot accept new consent.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: locale
          in: query
          required: true
          schema:
            type: string
          description: Exact published locale identifier; no language fallback is applied.
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Exact published current or forward revision to review; omitted means the enrollment's current revision.
      responses:
        '200':
          description: Immutable consent presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPresentationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /participant/enrollments/{enrollmentId}/consents:
    get:
      tags:
        - Participant
      summary: List consent records for an enrollment
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: List of consent records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Participant
      summary: Submit a consent record
      description: >
        Requires Idempotency-Key and If-Match. Exact authorized replay returns the
        original receipt before checking current enrollment state, including after
        withdrawal; it never restores access. Reusing a key with changed content
        or expected version conflicts. A new command requires the current active
        enrollment version and exact reviewed presentation. An explicit forward
        reviewedRevision requires fresh consent and target eligibility; consent,
        revision adoption, enrollment version and audit are committed together.
        Later publication cannot select an unseen revision. Downgrades are rejected.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID scoped to this enrollment; reuse the same key and complete command when retrying.
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Exact strong enrollmentETag from the presentation response. Weak, wildcard and multiple tags are not accepted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - consentData
                - consentPDF
                - reviewedRevision
                - presentation
              properties:
                presentation:
                  $ref: '#/components/schemas/ConsentPresentationReference'
                reviewedRevision:
                  type: integer
                  minimum: 1
                  description: Exact published current or forward study revision presented to the participant; never implicitly replaced by the latest revision.
                consentData:
                  $ref: '#/components/schemas/UserResponses'
                consentPDF:
                  type: string
                  format: binary
            encoding:
              presentation:
                contentType: application/json
              reviewedRevision:
                contentType: application/json
              consentData:
                contentType: application/json
              consentPDF:
                contentType: application/pdf
      responses:
        '201':
          description: Consent record created, or the original record returned for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /participant/studies/{studyId}/{revision}/bundle:
    get:
      tags:
        - Participant
      summary: Download a study bundle for a published revision
      description: >
        Downloads the study bundle ZIP for a specific published revision
        from object storage. Requires the participant to be enrolled in the
        study.
      parameters:
        - $ref: '#/components/parameters/StudyId'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Study bundle ZIP file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment header for file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /participant/enrollments/{enrollmentId}/consents/{consentId}/pdf:
    get:
      tags:
        - Participant
      summary: Download a consent PDF
      description: >
        Downloads the signed consent PDF for a specific consent record
        from object storage. Modern evidence must match its accepted digest;
        incomplete metadata or changed bytes return a conflict without the PDF.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/ConsentId'
      responses:
        '200':
          description: Consent PDF file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment header for file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    DelegationId:
      name: Trove-Delegation-ID
      in: header
      description: >
        Selects a server-side grant for a registered draft-only OAuth client. It
        cannot authorize a request by itself. Interactive clients must omit it.
      schema:
        type: string
        format: uuid
    DraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        The draftRevision returned by the study read, enclosed in double quotes.
        One strong revision covers metadata, components and schedules. A stale
        revision returns 412 without changing the draft; clients must reload and
        review the conflict rather than automatically replaying an edit.
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyId:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CodeId:
      name: codeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentId:
      name: consentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    OperationFailure:
      description: Operation denied or unavailable; no protected change or disclosure was accepted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Resource state no longer matches the submitted precondition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT access token
  schemas:
    # ── Shared ────────────────────────────────────────────────────────────

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence

    StudyAuditAction:
      type: string
      enum:
        - consent.recorded
        - consent.pdf.disclosure
        - consent.records.disclosure
        - collection.plan.disclosure
        - enrollment.withdrawn
        - study.published
        - study.publication.disclosure
        - study.draft.deleted
        - study.draft.created
        - study.draft.edited
        - study.draft.validated
        - study.draft.disclosure
        - delegation.created
        - delegation.revoked
        - delegation.disclosure
        - study.bundle.disclosure
        - artifact.discard.scheduled
        - study.data.granted
        - study.audit.disclosure

    StudyPublicationInput:
      type: object
      additionalProperties: false
      required: [validationId]
      properties:
        validationId:
          type: string
          format: uuid
          description: Server-issued immutable candidate ID and natural publication retry identity.

    StudyDraftValidation:
      type: object
      additionalProperties: false
      required: [id, draftRevision, publicationRevision, bundleSha256, validatorIdentity, contractRevision, executionCapability, createdAt, expiresAt, questionnaires]
      properties:
        id:
          type: string
          format: uuid
        draftRevision:
          type: string
          format: uuid
        publicationRevision:
          type: integer
          minimum: 1
        bundleSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        validatorIdentity:
          type: string
        contractRevision:
          type: string
        executionCapability:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        questionnaires:
          type: array
          items:
            $ref: '#/components/schemas/StudyQuestionnaireValidation'

    StudyQuestionnaireValidation:
      type: object
      additionalProperties: false
      required: [componentId, locale, sha256]
      properties:
        componentId:
          type: string
          format: uuid
        locale:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    StudyDelegationPreset:
      type: string
      enum: [inspectStudy, editStudyDraft]

    StudyDelegationInput:
      type: object
      additionalProperties: false
      required: [clientId, preset, expiresAt]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 255
        preset:
          $ref: '#/components/schemas/StudyDelegationPreset'
        expiresAt:
          type: string
          format: date-time

    StudyDelegation:
      type: object
      additionalProperties: false
      required: [id, studyId, clientId, preset, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        clientId:
          type: string
        preset:
          $ref: '#/components/schemas/StudyDelegationPreset'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    StudyDelegationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudyDelegation'
        nextBefore:
          type: string
          format: uuid

    AuditActor:
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer:
          type: string
        subject:
          type: string

    StudyAuditRecord:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actor, action, targetId, outcome, correlationId]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        initiator:
          $ref: '#/components/schemas/AuditActor'
        executingClientId:
          type: string
          description: Registered OAuth client from verified authentication.
        delegationId:
          type: string
          format: uuid
          description: Server-authorized application grant, not a credential.
        action:
          $ref: '#/components/schemas/StudyAuditAction'
        targetId:
          type: string
          format: uuid
        targetVersion:
          type: string
        outcome:
          type: string
          enum: [succeeded, disclosure_intent]
        correlationId:
          type: string
          format: uuid
        applicationRevision:
          type: string

    StudyAuditPage:
      type: object
      additionalProperties: false
      required: [studyId, records]
      properties:
        studyId:
          type: string
          format: uuid
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudyAuditRecord'
        nextBefore:
          type: string
          format: uuid
          description: Last returned event ID when another older page exists.

    EventTarget:
      type: object
      additionalProperties: false
      required: [consentId, outputFullUrls]
      properties:
        consentId:
          type: string
          format: uuid
          description: Exact immutable consent; enrollment and publication are resolved server-side.
        outputFullUrls:
          type: array
          minItems: 1
          maxItems: 512
          uniqueItems: true
          description: Exact clinical output entry addresses in this event, not moving logical identities.
          items:
            type: string
            minLength: 1
            maxLength: 512

    EventTargets:
      type: array
      minItems: 0
      maxItems: 16
      description: >
        Distinct consent IDs; each target lists distinct output addresses. Normalized intent is limited to 512 KiB.
        Active events and attribution commands require at least one target. Retraction events require an empty
        array and never grant study access. Receipt lookup repeats the original event's targets exactly.
      items:
        $ref: '#/components/schemas/EventTarget'

    EventSubmission:
      type: object
      additionalProperties: false
      required: [eventBase64, targets]
      properties:
        eventBase64:
          type: string
          minLength: 4
          maxLength: 5592408
          description: RFC 4648 standard padded base64, without whitespace, of the original Grove Mobile event bytes. At most 4 MiB decoded.
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventBatchSubmission:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/EventSubmission'

    EventBatchResult:
      description: >
        An immutable custody receipt or a per-event problem. Retry transient
        problems (408, 429, 5xx) with unchanged bytes and targets and bounded
        backoff. Preserve other rejected events for inspection. Never interpret
        an outer HTTP 200 as acceptance of every member.
      oneOf:
        - $ref: '#/components/schemas/EventReceipt'
        - $ref: '#/components/schemas/ProblemDetails'

    EventAttribution:
      type: object
      additionalProperties: false
      required: [commandId, targets]
      properties:
        commandId:
          type: string
          format: uuid
          description: Durable client command ID, unique within the registered source.
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventAttributionReceipt:
      type: object
      additionalProperties: false
      required: [commandId, eventId, targetIntentSHA256, acceptedAt, authorizedOutputCount]
      properties:
        commandId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        targetIntentSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        acceptedAt:
          type: string
          format: date-time
        authorizedOutputCount:
          type: integer
          minimum: 1
          maximum: 8192
          description: Requested exact consent/output pairs authorized at command acceptance, including already-existing grants; not current access.

    EventReceiptLookup:
      type: object
      additionalProperties: false
      required: [producerEventIdentifier, payloadSHA256, targets]
      properties:
        producerEventIdentifier:
          type: object
          additionalProperties: false
          required: [system, value]
          properties:
            system:
              type: string
              minLength: 1
              maxLength: 4096
            value:
              type: string
              minLength: 1
              maxLength: 4096
        payloadSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        targets:
          $ref: '#/components/schemas/EventTargets'

    EventReceipt:
      type: object
      additionalProperties: false
      description: >
        Durable custody acknowledgement for one original producer event, not a
        statement of current study access or graph visibility. Before retiring
        staged bytes, the client must match the source, complete producer event
        identifier, payload SHA-256 and target-intent SHA-256 against its durable staging record. An HTTP
        success alone is insufficient. Exact retries return the persisted receipt.
      required:
        - eventId
        - sourceId
        - producerEventIdentifier
        - payloadSHA256
        - targetIntentSHA256
        - receivedAt
        - nodeCount
      properties:
        eventId:
          type: string
          format: uuid
          description: Server-assigned immutable custody record ID, not the producer's event identifier.
        sourceId:
          type: string
          format: uuid
        producerEventIdentifier:
          type: object
          additionalProperties: false
          description: Complete identifier from the accepted original Bundle.
          required:
            - system
            - value
          properties:
            system:
              type: string
              format: uri
            value:
              type: string
              minLength: 1
        payloadSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase SHA-256 of the accepted event bytes, before any JSON normalization.
        targetIntentSHA256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            SHA-256 of UTF-8 canonical target JSON: array sorted by consent ID,
            lowercase UUIDs, lexically sorted distinct ASCII output addresses,
            object keys consentId then outputFullUrls, compact JSON without escaped
            slashes. Bind this to the original staged intent, not later attribution.
        receivedAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
          minimum: 1

    ParticipantCollectionPlan:
      type: object
      additionalProperties: false
      required: [enrollmentId, stateVersion, asOf, windows]
      properties:
        enrollmentId:
          type: string
          format: uuid
        stateVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          type: string
          format: date-time
          description: Server observation time; not an expiration or promise of future eligibility.
        windows:
          type: array
          maxItems: 1024
          description: Ordered by consent adoption, never by latest publication. Empty means no collection.
          items:
            $ref: '#/components/schemas/ConsentCollectionWindow'

    ConsentCollectionWindow:
      type: object
      additionalProperties: false
      required: [consentId, publicationId, revision, start, requirements]
      properties:
        consentId:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        start:
          type: string
          format: date-time
          description: Inclusive measurement-time boundary at exact consent acceptance.
        end:
          type: string
          format: date-time
          description: Exclusive next-adoption boundary. Equal to start means an empty interval; omitted means no later adoption.
        requirements:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/CollectionRequirement'

    CollectionRequirement:
      type: object
      additionalProperties: false
      description: >
        Explicit backend collection permission, independent of native HealthKit
        components. The current receiver supports the Grove Mobile heart-rate
        profile as immutable point quantities from participant-app streams,
        measured at or after the exact consent acceptance. This does not attest
        the source device or authorize historical data.
      required:
        - profile
        - sourceKind
      properties:
        profile:
          type: string
          format: uri
          examples:
            - https://grovealliance.org/fhir/mobile/StructureDefinition/grove-mobile-heart-rate
        sourceKind:
          type: string
          enum:
            - participant-app

    PseudonymousIdentifierSystems:
      type: object
      additionalProperties: false
      description: >
        Complete, distinct Grove HMAC identifier namespaces for this source.
        Immutable across registration retries and revocation. These public
        identifiers are not keys or credentials. Clients persist the returned
        set with the source binding; they must not substitute global defaults.
      required:
        - sourceRecord
        - sourceOutput
        - writerRecord
        - providerRecord
        - providerOutput
        - sourceArtifact
        - providerArtifact
        - sourceContext
        - recordingDevice
        - deviceSnapshot
      properties:
        sourceRecord:
          type: string
          format: uri
          maxLength: 512
        sourceOutput:
          type: string
          format: uri
          maxLength: 512
        writerRecord:
          type: string
          format: uri
          maxLength: 512
        providerRecord:
          type: string
          format: uri
          maxLength: 512
        providerOutput:
          type: string
          format: uri
          maxLength: 512
        sourceArtifact:
          type: string
          format: uri
          maxLength: 512
        providerArtifact:
          type: string
          format: uri
          maxLength: 512
        sourceContext:
          type: string
          format: uri
          maxLength: 512
        recordingDevice:
          type: string
          format: uri
          maxLength: 512
        deviceSnapshot:
          type: string
          format: uri
          maxLength: 512

    ParticipantSource:
      type: object
      additionalProperties: false
      description: >
        Server-assigned identity for an unverified participant-app stream.
        Identifiers are not credentials. Every use requires participant
        authentication and ownership checks. This is not provider attestation.
      required:
        - id
        - registrationID
        - kind
        - eventIdentifierSystem
        - pseudonymousIdentifierSystems
        - producerInstance
        - participantIdentifier
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        registrationID:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - participant-app
        eventIdentifierSystem:
          type: string
          format: uri
          description: Immutable namespace for event identifiers only, not HMAC identifiers.
        pseudonymousIdentifierSystems:
          $ref: '#/components/schemas/PseudonymousIdentifierSystems'
        producerInstance:
          type: string
          format: uuid
          description: The durable producer stream identity used in Grove event values.
        participantIdentifier:
          type: object
          additionalProperties: false
          description: Complete FHIR Patient business identifier assigned to this participant.
          required:
            - system
            - value
          properties:
            system:
              type: string
              format: uri
            value:
              type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: Present only after permanent revocation; never cleared.

    LocalizationKey:
      type: string
      description: 'A locale identifier in language-region format (e.g. en-US, de-DE)'
      examples:
        - 'en-US'

    LocalizedString:
      type: object
      description: Localized string keyed by locale (e.g., "en-US" -> "value")
      additionalProperties:
        type: string
      examples:
        - en-US: 'Hello'

    DateComponents:
      type: object
      description: >
        Calendar-relative offset applied from the session creation time.
        At least one component must be provided. Uses Swift DateComponents naming (singular).
      properties:
        year:
          type: integer
          minimum: 0
        month:
          type: integer
          minimum: 0
        day:
          type: integer
          minimum: 0
      minProperties: 1
      additionalProperties: false

    SampleTypesCollection:
      type: array
      description: HealthKit sample types in GroveHealthKit format (ClassName;Identifier)
      items:
        type: string
      examples:
        - - 'HKQuantityType;HKQuantityTypeIdentifierHeartRate'
          - 'HKQuantityType;HKQuantityTypeIdentifierStepCount'
          - 'HKCategoryType;HKCategoryTypeIdentifierSleepAnalysis'

    # ── Groups ────────────────────────────────────────────────────────────

    GroupResponse:
      type: object
      description: Group synced from Keycloak. Name is unique.
      required:
        - id
        - name
        - icon
      properties:
        id:
          type: string
          format: uuid
          description: Keycloak group ID
        name:
          type: string
          description: Unique group name (matches Keycloak group name)
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name, stored as Keycloak group attribute)

    # ── Studies — Building Blocks ─────────────────────────────────────────

    StudyDetailContent:
      type: object
      description: Per-locale study detail fields
      required:
        - title
      properties:
        title:
          type: string
        shortTitle:
          type: string
        explanationText:
          type: string
        shortExplanationText:
          type: string

    StudyDetailData:
      type: object
      description: Localized study details keyed by locale
      additionalProperties:
        $ref: '#/components/schemas/StudyDetailContent'
      examples:
        - en-US:
            title: 'My Heart Counts'
            shortTitle: 'MHC'
            explanationText: 'This study aims to...'
            shortExplanationText: 'A heart health study'

    ParticipationCriterion:
      description: >
        A criterion which must be satisfied for a person to participate in a study.
        Uses a discriminated union on "type". Leaf criteria carry a single value.
        Logical operators (not, all, any) are recursive.
      oneOf:
        - $ref: '#/components/schemas/AgeAtLeastCriterion'
        - $ref: '#/components/schemas/IsFromRegionCriterion'
        - $ref: '#/components/schemas/SpeaksLanguageCriterion'
        - $ref: '#/components/schemas/NotCriterion'
        - $ref: '#/components/schemas/AllCriterion'
        - $ref: '#/components/schemas/AnyCriterion'
      discriminator:
        propertyName: type
        mapping:
          ageAtLeast: '#/components/schemas/AgeAtLeastCriterion'
          isFromRegion: '#/components/schemas/IsFromRegionCriterion'
          speaksLanguage: '#/components/schemas/SpeaksLanguageCriterion'
          not: '#/components/schemas/NotCriterion'
          all: '#/components/schemas/AllCriterion'
          any: '#/components/schemas/AnyCriterion'

    AgeAtLeastCriterion:
      type: object
      description: Requires the participant to be at least a certain age
      required:
        - type
        - age
      properties:
        type:
          type: string
          enum: [ageAtLeast]
        age:
          type: integer
          minimum: 0
      additionalProperties: false

    IsFromRegionCriterion:
      type: object
      description: Requires the participant to be from a specific region
      required:
        - type
        - region
      properties:
        type:
          type: string
          enum: [isFromRegion]
        region:
          type: string
          description: Region identifier (e.g. "US", "DE")
      additionalProperties: false

    SpeaksLanguageCriterion:
      type: object
      description: Requires the participant to speak a specific language
      required:
        - type
        - language
      properties:
        type:
          type: string
          enum: [speaksLanguage]
        language:
          type: string
          description: Language identifier (e.g. "en", "de")
      additionalProperties: false

    NotCriterion:
      type: object
      description: Negates a criterion
      required:
        - type
        - criterion
      properties:
        type:
          type: string
          enum: [not]
        criterion:
          $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false

    AllCriterion:
      type: object
      description: Requires all criteria to be satisfied (logical AND)
      required:
        - type
        - criteria
      properties:
        type:
          type: string
          enum: [all]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false
      examples:
        - type: all
          criteria:
            - type: ageAtLeast
              age: 18
            - type: any
              criteria:
                - type: isFromRegion
                  region: 'US'
                - type: isFromRegion
                  region: 'DE'

    AnyCriterion:
      type: object
      description: Requires at least one criterion to be satisfied (logical OR)
      required:
        - type
        - criteria
      properties:
        type:
          type: string
          enum: [any]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationCriterion'
      additionalProperties: false

    # ── Studies — Request / Response ──────────────────────────────────────

    StudyListItem:
      type: object
      description: Summary of a study for list views
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Study title (en-US preferred, falls back to first available locale)

    StudyCreateInput:
      type: object
      description: Request body for creating a new study
      required:
        - title
        - icon
      properties:
        title:
          type: string
          description: Study title (stored under en-US locale)
          examples:
            - 'My Heart Counts'
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart

    StudyPatchInput:
      type: object
      description: Partial update for a study. All fields are optional.
      properties:
        collectionRequirements:
          type: array
          maxItems: 1
          uniqueItems: true
          description: Empty disables backend collection in the next publication; existing publications are unchanged.
          items:
            $ref: '#/components/schemas/CollectionRequirement'
        locales:
          type: array
          uniqueItems: true
          description: Supported locales for the study
          items:
            $ref: '#/components/schemas/LocalizationKey'
          minItems: 1
          examples:
            - ['en-US', 'de-DE']
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart
        details:
          $ref: '#/components/schemas/StudyDetailData'
        participationCriterion:
          $ref: '#/components/schemas/ParticipationCriterion'
        consent:
          $ref: '#/components/schemas/StudyConsent'
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    StudyResponse:
      type: object
      description: Full study response
      required:
        - collectionRequirements
        - draftRevision
        - id
        - locales
        - icon
        - details
        - participationCriterion
        - consent
        - visibility
        - enrollmentConditions
      properties:
        draftRevision:
          type: string
          format: uuid
          description: Opaque revision of the complete editable study draft.
        collectionRequirements:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CollectionRequirement'
        id:
          type: string
          format: uuid
        locales:
          type: array
          uniqueItems: true
          description: Supported locales for the study
          items:
            $ref: '#/components/schemas/LocalizationKey'
          examples:
            - ['en-US', 'de-DE']
        icon:
          type: string
          description: Icon identifier (e.g. SF Symbol name)
          examples:
            - heart
        details:
          $ref: '#/components/schemas/StudyDetailData'
        participationCriterion:
          $ref: '#/components/schemas/ParticipationCriterion'
        consent:
          $ref: '#/components/schemas/StudyConsent'
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    # ── Enrollment Conditions ──────────────────────────────────────────────

    EnrollmentConditions:
      type: string
      description: Defines how enrollment into a study works
      enum:
        - none
        - requiresInvitationCode

    # ── Published Studies ────────────────────────────────────────────────

    StudyVisibility:
      type: string
      description: Whether a published study is listed publicly or only accessible via invitation code
      enum:
        - public
        - unlisted

    PublishedStudyResponse:
      type: object
      description: A published study revision
      required:
        - id
        - studyId
        - revision
        - visibility
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        revision:
          type: integer
          description: The revision number of this publication
          examples:
            - 1
        visibility:
          $ref: '#/components/schemas/StudyVisibility'
        publishedAt:
          type: string
          format: date-time
          description: When this revision was published

    # ── Components — Shared ───────────────────────────────────────────────

    Component:
      type: object
      description: A component summary with type, id, and name
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - informational
            - questionnaire
            - healthDataCollection
          description: Component type
        name:
          type: string
          description: Display name for the component

    # ── Component Schedules ─────────────────────────────────────────────

    ComponentScheduleInput:
      type: object
      description: Request body for creating or updating a component schedule
      required:
        - scheduleDefinition
        - completionPolicy
        - notification
      properties:
        scheduleDefinition:
          $ref: '#/components/schemas/ScheduleDefinition'
        completionPolicy:
          $ref: '#/components/schemas/AllowedCompletionPolicy'
        notification:
          type: boolean
          description: Whether notifications are enabled for this schedule. When true, uses task-based notification threading.

    ComponentSchedule:
      type: object
      description: A schedule defining when a component should be presented to the participant
      required:
        - id
        - scheduleDefinition
        - completionPolicy
        - notification
      properties:
        id:
          type: string
          format: uuid
          description: Schedule ID (assigned by server on creation)
        scheduleDefinition:
          $ref: '#/components/schemas/ScheduleDefinition'
        completionPolicy:
          $ref: '#/components/schemas/AllowedCompletionPolicy'
        notification:
          type: boolean
          description: Whether notifications are enabled for this schedule. When true, uses task-based notification threading.

    ScheduleDefinition:
      description: Defines when and how often a schedule fires
      oneOf:
        - $ref: '#/components/schemas/OnceScheduleDefinition'
        - $ref: '#/components/schemas/RepeatedScheduleDefinition'
      discriminator:
        propertyName: type
        mapping:
          once: '#/components/schemas/OnceScheduleDefinition'
          repeated: '#/components/schemas/RepeatedScheduleDefinition'

    OnceScheduleDefinition:
      type: object
      description: A schedule that fires a single time
      required:
        - type
        - pattern
      properties:
        type:
          type: string
          enum: [once]
        pattern:
          $ref: '#/components/schemas/OneTimeSchedule'
      additionalProperties: false

    RepeatedScheduleDefinition:
      type: object
      description: A schedule that fires repeatedly based on a pattern
      required:
        - type
        - pattern
      properties:
        type:
          type: string
          enum: [repeated]
        pattern:
          $ref: '#/components/schemas/RepetitionPattern'
        offset:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false

    OneTimeSchedule:
      description: Defines when a one-time schedule fires
      oneOf:
        - $ref: '#/components/schemas/DateOneTimeSchedule'
        - $ref: '#/components/schemas/EventOneTimeSchedule'
      discriminator:
        propertyName: type
        mapping:
          date: '#/components/schemas/DateOneTimeSchedule'
          event: '#/components/schemas/EventOneTimeSchedule'

    DateOneTimeSchedule:
      type: object
      description: Fires once at a specific date
      required:
        - type
        - dateComponents
      properties:
        type:
          type: string
          enum: [date]
        dateComponents:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false

    EventOneTimeSchedule:
      type: object
      description: Fires once in response to a study lifecycle event
      required:
        - type
        - event
      properties:
        type:
          type: string
          enum: [event]
        event:
          $ref: '#/components/schemas/StudyLifecycleEvent'
        offsetInDays:
          type: integer
          default: 0
          description: Number of days after the event
        time:
          $ref: '#/components/schemas/ScheduleTime'
      additionalProperties: false
      examples:
        - type: event
          event:
            type: activation
          offsetInDays: 1
          time:
            hour: 9
            minute: 0

    RepetitionPattern:
      description: Defines how a repeated schedule recurs
      oneOf:
        - $ref: '#/components/schemas/DailyRepetition'
        - $ref: '#/components/schemas/WeeklyRepetition'
        - $ref: '#/components/schemas/MonthlyRepetition'
      discriminator:
        propertyName: type
        mapping:
          daily: '#/components/schemas/DailyRepetition'
          weekly: '#/components/schemas/WeeklyRepetition'
          monthly: '#/components/schemas/MonthlyRepetition'

    DailyRepetition:
      type: object
      description: Repeats every N days at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [daily]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N days
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    WeeklyRepetition:
      type: object
      description: Repeats every N weeks on an optional weekday at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [weekly]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N weeks
        weekday:
          type: string
          description: Day of week (e.g. "monday", "tuesday"). Omit to repeat relative to enrollment date.
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    MonthlyRepetition:
      type: object
      description: Repeats every N months on an optional day at a specific time
      required:
        - type
        - hour
      properties:
        type:
          type: string
          enum: [monthly]
        interval:
          type: integer
          minimum: 1
          default: 1
          description: Repeat every N months
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month. Omit to repeat relative to enrollment date.
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    StudyLifecycleEvent:
      description: A study lifecycle event that can trigger a one-time schedule
      oneOf:
        - $ref: '#/components/schemas/EnrollmentEvent'
        - $ref: '#/components/schemas/ActivationEvent'
        - $ref: '#/components/schemas/UnenrollmentEvent'
        - $ref: '#/components/schemas/StudyEndEvent'
        - $ref: '#/components/schemas/CompletedTaskEvent'
      discriminator:
        propertyName: type
        mapping:
          enrollment: '#/components/schemas/EnrollmentEvent'
          activation: '#/components/schemas/ActivationEvent'
          unenrollment: '#/components/schemas/UnenrollmentEvent'
          studyEnd: '#/components/schemas/StudyEndEvent'
          completedTask: '#/components/schemas/CompletedTaskEvent'

    EnrollmentEvent:
      type: object
      description: Triggered on first enrollment
      required:
        - type
      properties:
        type:
          type: string
          enum: [enrollment]
      additionalProperties: false

    ActivationEvent:
      type: object
      description: Triggered on study activation
      required:
        - type
      properties:
        type:
          type: string
          enum: [activation]
      additionalProperties: false

    UnenrollmentEvent:
      type: object
      description: Triggered when participant unenrolls
      required:
        - type
      properties:
        type:
          type: string
          enum: [unenrollment]
      additionalProperties: false

    StudyEndEvent:
      type: object
      description: Triggered when the study officially ends
      required:
        - type
      properties:
        type:
          type: string
          enum: [studyEnd]
      additionalProperties: false

    CompletedTaskEvent:
      type: object
      description: Triggered when a specific component task is completed
      required:
        - type
        - componentId
      properties:
        type:
          type: string
          enum: [completedTask]
        componentId:
          type: string
          format: uuid
          description: ID of the component whose completion triggers this event
      additionalProperties: false

    ScheduleTime:
      type: object
      description: Time of day for a schedule occurrence
      required:
        - hour
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
        second:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
      additionalProperties: false

    AllowedCompletionPolicy:
      type: string
      description: When a scheduled event is allowed to be completed
      enum:
        - sameDay
        - afterStart
        - sameDayAfterStart
        - duringEvent
        - anytime

    # ── Components — Informational ────────────────────────────────────────

    InformationalContent:
      type: object
      description: Content for a single locale in an informational component
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: The title of the informational component
        lede:
          type: string
          description: A short introductory text or subtitle
        content:
          type: string
          description: The main content text

    InformationalComponentData:
      type: object
      description: Localized informational content keyed by locale (e.g., "en-US", "de-DE")
      additionalProperties:
        $ref: '#/components/schemas/InformationalContent'
      examples:
        - en-US:
            title: 'Welcome'
            lede: 'Introduction to the study'
            content: 'Welcome to the study'
          de-DE:
            title: 'Willkommen'
            lede: 'Einführung in die Studie'
            content: 'Willkommen zur Studie'

    InformationalComponentInput:
      type: object
      description: Request body for creating or updating an informational component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/InformationalComponentData'

    InformationalComponentResponse:
      type: object
      description: Response containing informational component with ID and name
      required:
        - id
        - name
        - data
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/InformationalComponentData'

    # ── Components — Questionnaire ────────────────────────────────────────

    QuestionnaireContent:
      type: object
      description: Content for a single locale in a questionnaire component
      required:
        - questionnaire
      properties:
        questionnaire:
          type: string
          description: FHIR Questionnaire as JSON string

    QuestionnaireComponentData:
      type: object
      description: Localized questionnaire content keyed by locale (e.g., "en-US", "de-DE")
      additionalProperties:
        $ref: '#/components/schemas/QuestionnaireContent'
      examples:
        - en-US:
            questionnaire: '{"resourceType": "Questionnaire", "title": "Daily Survey"}'
          de-DE:
            questionnaire: '{"resourceType": "Questionnaire", "title": "Tägliche Umfrage"}'

    QuestionnaireComponentInput:
      type: object
      description: Request body for creating or updating a questionnaire component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/QuestionnaireComponentData'

    QuestionnaireComponentResponse:
      type: object
      description: Response containing questionnaire component with ID and name
      required:
        - id
        - name
        - data
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/QuestionnaireComponentData'

    # ── Components — Health Data ──────────────────────────────────────────

    ExportSessionStartDate:
      description: >
        Defines how the start date of an export session is determined.
        This represents a strategy rather than a concrete date.
      oneOf:
        - $ref: '#/components/schemas/OldestSampleStartDate'
        - $ref: '#/components/schemas/RelativeStartDate'
        - $ref: '#/components/schemas/AbsoluteStartDate'
      discriminator:
        propertyName: type
        mapping:
          oldestSample: '#/components/schemas/OldestSampleStartDate'
          last: '#/components/schemas/RelativeStartDate'
          absolute: '#/components/schemas/AbsoluteStartDate'

    OldestSampleStartDate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [oldestSample]
      additionalProperties: false
      description: >
        Uses the oldest available sample as the start date.

    RelativeStartDate:
      type: object
      required:
        - type
        - components
      properties:
        type:
          type: string
          enum: [last]
        components:
          $ref: '#/components/schemas/DateComponents'
      additionalProperties: false
      description: >
        Uses a calendar-relative offset from the time the session was created.

    AbsoluteStartDate:
      type: object
      required:
        - type
        - date
      properties:
        type:
          type: string
          enum: [absolute]
        date:
          type: string
          format: date-time
      additionalProperties: false
      description: >
        Uses a fixed absolute date as the start date.

    HealthDataComponentData:
      type: object
      description: A health data component for collecting health metrics
      required:
        - sampleTypes
      properties:
        sampleTypes:
          $ref: '#/components/schemas/SampleTypesCollection'
        historicalDataCollection:
          type: object
          description: Configuration for collecting historical health data
          properties:
            enabled:
              type: boolean
              default: false
            startDate:
              $ref: '#/components/schemas/ExportSessionStartDate'

    HealthDataComponentInput:
      type: object
      description: Request body for creating or updating a health data component
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/HealthDataComponentData'

    HealthDataComponentResponse:
      type: object
      description: Response containing health data component with ID and name
      required:
        - id
        - name
        - data
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the component
        data:
          $ref: '#/components/schemas/HealthDataComponentData'

    # ── Invitation Codes ───────────────────────────────────────────────

    InvitationCodeResponse:
      type: object
      description: An invitation code for a study
      required:
        - id
        - studyId
        - code
        - used
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        code:
          type: string
        used:
          type: boolean
        enrollmentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    InvitationCodeCreateInput:
      type: object
      description: Request body for generating invitation codes
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of invitation codes to generate
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration date for the generated codes

    # ── Enrollments ────────────────────────────────────────────────────

    EnrollmentResponse:
      type: object
      description: An enrollment in a study
      required:
        - id
        - studyId
        - participantId
        - currentRevision
        - stateVersion
        - enrolledAt
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        currentRevision:
          type: integer
        stateVersion:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic enrollment concurrency version; independent of the adopted study revision.
        enrolledAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time

    # ── Participant ────────────────────────────────────────────────────

    PublishedStudyListItem:
      type: object
      description: Summary of a published study for participant browsing
      required:
        - studyId
        - revision
        - metadata
        - enrollmentConditions
      properties:
        studyId:
          type: string
          format: uuid
          description: The study ID
        revision:
          type: integer
          minimum: 1
          description: The latest published revision number
        metadata:
          $ref: '#/components/schemas/StudyMetadataCodable'
        enrollmentConditions:
          $ref: '#/components/schemas/EnrollmentConditions'

    StudyMetadataCodable:
      description: >
        Study metadata as GroveStudyDefinition.StudyDefinition.Metadata.
        Mapped via typeOverride; the wire format matches Swift's auto-synthesized Codable output.
      type: object
      additionalProperties: true

    EnrollInput:
      type: object
      description: Optional request body for enrolling in a study
      properties:
        invitationCode:
          type: string
          description: Optional invitation code for studies that require one

    # ── Consent Schemas ──────────────────────────────────────────────────

    ConsentContent:
      type: object
      description: Localized consent form content (title and markdown body)
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
          description: Consent document markdown

    StudyConsent:
      type: object
      description: Locale-keyed map of consent content
      additionalProperties:
        $ref: '#/components/schemas/ConsentContent'
      examples:
        - en-US:
            title: Study Consent Form
            content: "# Consent\n\nBy participating..."
          de-DE:
            title: Einwilligungserklärung
            content: "# Einwilligung\n\nDurch die Teilnahme..."

    NameComponents:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string

    SignatureData:
      type: object
      required:
        - name
        - signature
        - size
      properties:
        name:
          $ref: '#/components/schemas/NameComponents'
        signature:
          type: string
          description: Base64-encoded PKDrawing data
        size:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: '[width, height] in points'

    UserResponses:
      type: object
      properties:
        toggles:
          type: object
          additionalProperties:
            type: boolean
        selects:
          type: object
          additionalProperties:
            type: string
        signatures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SignatureData'

    ConsentPresentationReference:
      type: object
      description: Identity of the exact localized Markdown reviewed by the participant, not a claim that the client rendered or understood it.
      required:
        - presentationId
        - locale
        - digest
      properties:
        presentationId:
          type: string
          format: uuid
        locale:
          type: string
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the exact UTF-8 Markdown returned by the server.

    ConsentPresentationResponse:
      type: object
      required:
        - presentation
        - revision
        - markdown
        - enrollmentStateVersion
        - enrollmentETag
      properties:
        presentation:
          $ref: '#/components/schemas/ConsentPresentationReference'
        revision:
          type: integer
          minimum: 1
        markdown:
          type: string
          description: Exact retained Markdown; clients must not substitute a current draft or another locale.
        enrollmentStateVersion:
          type: integer
          format: int64
          minimum: 1
        enrollmentETag:
          type: string
          description: Strong enrollment state tag to submit unchanged as If-Match.

    ConsentRecordResponse:
      type: object
      description: A submitted consent record
      required:
        - id
        - enrollmentId
        - revision
        - userResponses
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        revision:
          type: integer
        userResponses:
          $ref: '#/components/schemas/UserResponses'
        presentation:
          $ref: '#/components/schemas/ConsentPresentationReference'
        acceptedEnrollmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: Immutable version at acceptance, not the current enrollment state. Absent for historical records.
        createdAt:
          type: string
          format: date-time
          description: When the consent was submitted

    GenderIdentity:
      type: string
      description: Self-identified gender identity
      enum:
        - female
        - male
        - transgender
        - nonBinary
        - preferNotToState

    ParticipantProfile:
      type: object
      description: The authenticated participant's profile
      required:
        - id
        - firstName
        - lastName
        - email
        - gender
        - dateOfBirth
        - region
        - language
        - phoneNumber
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 200
        lastName:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        gender:
          $ref: '#/components/schemas/GenderIdentity'
        dateOfBirth:
          type: string
          format: date
        region:
          type: string
          maxLength: 10
        language:
          type: string
          maxLength: 10
        phoneNumber:
          type: string
          maxLength: 30

    ParticipantProfileInput:
      type: object
      description: Input for creating or updating the participant's profile
      required:
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - region
        - language
        - phoneNumber
      properties:
        firstName:
          type: string
          maxLength: 200
        lastName:
          type: string
          maxLength: 200
        gender:
          $ref: '#/components/schemas/GenderIdentity'
        dateOfBirth:
          type: string
          format: date
        region:
          type: string
          maxLength: 10
        language:
          type: string
          maxLength: 10
        phoneNumber:
          type: string
          maxLength: 30
