apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-server
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: trove-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trove-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trove-server
    spec:
      serviceAccountName: trove-server
      containers:
        - name: trove-server-container
          image: ghcr.io/schmiedmayerlab/trove-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: trove-server-config
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-runtime-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-runtime-credentials
                  key: password
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trove-server-secret
                  key: KEYCLOAK_CLIENT_SECRET
          startupProbe:
            httpGet:
              path: /api/v0/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v0/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v0/health
              port: 8080
            periodSeconds: 15
