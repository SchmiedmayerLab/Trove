apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-web
  namespace: trove
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: trove-web-container
          image: ghcr.io/schmiedmayerlab/trove-web:main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 256Mi
              cpu: 100m
