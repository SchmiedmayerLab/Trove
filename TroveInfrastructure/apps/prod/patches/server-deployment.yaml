apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-server
  namespace: trove
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    spec:
      initContainers:
        - name: trove-server-migrate
          image: ghcr.io/schmiedmayerlab/trove-server:main
          imagePullPolicy: Always
      containers:
        - name: trove-server-container
          image: ghcr.io/schmiedmayerlab/trove-server:main
          imagePullPolicy: Always
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
