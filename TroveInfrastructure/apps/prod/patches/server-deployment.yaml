apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-server
  namespace: trove
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: trove-server-container
          imagePullPolicy: Always
          volumeMounts:
            - name: serving-identity
              mountPath: /run/secrets/https
              readOnly: true
            - name: database-ca
              mountPath: /run/secrets/database
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
      volumes:
        - name: serving-identity
          secret:
            secretName: trove-main-tls-secret
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: database-ca
          secret:
            secretName: trove-db-ca
            items:
              - key: ca.crt
                path: ca.crt
