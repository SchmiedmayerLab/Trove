apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-web
  namespace: trove
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: trove-web-container
          image: ghcr.io/schmiedmayerlab/trove-web:main
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: serving-identity
              mountPath: /run/secrets/https
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 1Gi
              cpu: 100m
      volumes:
        - name: serving-identity
          secret:
            secretName: trove-main-tls-secret
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
