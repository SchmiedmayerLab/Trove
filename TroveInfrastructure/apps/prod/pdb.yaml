apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trove-server-pdb
  namespace: trove
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trove-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trove-web-pdb
  namespace: trove
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trove-web
