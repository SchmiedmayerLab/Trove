apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SchmiedmayerLab/Trove.git
    path: TroveInfrastructure/argocd-apps/dev
    targetRevision: "__TARGET_REVISION__"
    kustomize:
      patches:
        - target:
            group: argoproj.io
            version: v1alpha1
            kind: Application
            name: infrastructure
          patch: |-
            - op: add
              path: /spec/source/kustomize
              value:
                patches:
                  - target:
                      kind: NetworkPolicy
                      name: allow-cnpg-to-k8s-api
                    patch: |-
                      - op: replace
                        path: /spec/egress/1/to/0/ipBlock/cidr
                        value: "__KIND_API_CIDR__"
                  - target:
                      kind: NetworkPolicy
                      name: allow-traefik-egress
                    patch: |-
                      - op: replace
                        path: /spec/egress/3/to/0/ipBlock/cidr
                        value: "__KIND_API_CIDR__"
        - target:
            group: argoproj.io
            version: v1alpha1
            kind: Application
            labelSelector: troveplatform.org/revision-source=single
          patch: |-
            - op: replace
              path: /spec/source/targetRevision
              value: "__TARGET_REVISION__"
        - target:
            group: argoproj.io
            version: v1alpha1
            kind: Application
            labelSelector: troveplatform.org/revision-source=multiple
          patch: |-
            - op: replace
              path: /spec/sources/1/targetRevision
              value: "__TARGET_REVISION__"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
