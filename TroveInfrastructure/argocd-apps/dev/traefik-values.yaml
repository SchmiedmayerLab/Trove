# Traefik v3.7.19. The chart cannot derive the version from a digest.
image:
  digest: sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
versionOverride: v3.7.19
service:
  enabled: true
  spec:
    type: NodePort
log:
  level: WARN
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: drop
    names:
      StartUTC: keep
      RequestMethod: keep
      DownstreamStatus: keep
      Duration: keep
      RouterName: keep
      ServiceName: keep
    headers:
      defaultMode: drop
persistence:
  enabled: true
  name: traefik-data
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: standard
  path: /data
  annotations: {}
deployment:
  initContainers:
    - name: volume-permissions
      image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: ["sh", "-c", "touch /data/acme.json; chown 65532:65532 /data/acme.json; chmod -v 600 /data/acme.json"]
      securityContext:
        runAsNonRoot: false
        runAsGroup: 0
        runAsUser: 0
      volumeMounts:
        - name: traefik-data
          mountPath: /data
          readOnly: false
podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
ports:
  web:
    port: 8000
    nodePort: 30080
    expose:
      default: true
  websecure:
    port: 8443
    nodePort: 30443
    expose:
      default: true
    http:
      tls:
        enabled: true
ingressRoute:
  dashboard:
    enabled: true
additionalArguments:
  - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.244.0.0/16,127.0.0.1/32,172.16.0.0/12"
  - "--entrypoints.web.forwardedHeaders.trustedIPs=10.244.0.0/16,127.0.0.1/32,172.16.0.0/12"
