service:
  enabled: true
  type: LoadBalancer
  spec:
    loadBalancerIP: "34.182.76.103"
logs:
  general:
    level: WARN
  access:
    enabled: true
    format: json
    fields:
      general:
        defaultmode: drop
        names:
          StartUTC: keep
          RequestMethod: keep
          DownstreamStatus: keep
          Duration: keep
          RouterName: keep
          ServiceName: keep
      headers:
        defaultmode: drop
persistence:
  enabled: true
  name: traefik-data
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: standard-rwo
  path: /data
  annotations: {}
deployment:
  hostNetwork: false
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
ports: {}
ingressRoute:
  dashboard:
    enabled: false
additionalArguments: []
