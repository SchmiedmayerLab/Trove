# Pull the chart-selected Redis image directly from its upstream registry.
redis:
  image:
    repository: docker.io/library/redis

configs:
  cm:
    resource.customizations.ignoreResourceUpdates.external-secrets.io_PushSecret: |
      jsonPointers:
        - /status
    # App-of-apps waves must wait for child sync, hooks, and resource health.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for application sync"
      if obj.status == nil or obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
        return hs
      end
      if obj.status.operationState ~= nil then
        local phase = obj.status.operationState.phase
        if phase == "Running" then
          hs.message = "Waiting for application operation"
          return hs
        elseif phase == "Error" or phase == "Failed" then
          hs.status = "Degraded"
          hs.message = obj.status.operationState.message or "Application operation failed"
          return hs
        end
      end
      hs.message = "Waiting for application health"
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or hs.message
      end
      return hs
    resource.customizations.health.external-secrets.io_ClusterSecretStore: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the secret store"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            hs.message = condition.message or condition.reason or hs.message
            if condition.status == "True" then
              hs.status = "Healthy"
            elseif condition.status == "False" then
              hs.status = "Degraded"
            end
            return hs
          end
        end
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the generated secret"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            hs.message = condition.message or condition.reason or hs.message
            if condition.status == "True" then
              hs.status = "Healthy"
            elseif condition.status == "False" then
              hs.status = "Degraded"
            end
            return hs
          end
        end
      end
      return hs
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
          hs.message = obj.status.phase
        elseif obj.status.phase == "Setting up primary" or obj.status.phase == "Creating primary instance" then
          hs.status = "Progressing"
          hs.message = obj.status.phase
        else
          hs.status = "Degraded"
          hs.message = obj.status.phase or "Unknown"
        end
      else
        hs.status = "Progressing"
        hs.message = "Waiting for status"
      end
      return hs
  params:
    server.insecure: "true"
    server.basehref: /argo
    server.rootpath: /argo
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, certificates, *, *, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      g, /ArgoCDAdmins, role:admin
