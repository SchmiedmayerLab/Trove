apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job.yaml
  - service-account.yaml
configMapGenerator:
  - name: trove-database-operator
    namespace: trove
    files:
      - grant-runtime.sh
      - grant-runtime.sql
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
