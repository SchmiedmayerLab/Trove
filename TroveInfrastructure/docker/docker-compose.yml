volumes:
  server_authority_data:
  keycloak_db_data:
  seaweedfs_data:

services:
  server-db:
    image: timescale/timescaledb:latest-pg18@sha256:9508616d5b941ed931198504c5db3fb47e8f53f790732ea1e889591f1062057c
    volumes:
      - server_authority_data:/pgdata
      - ./init/010-timescale.sql:/docker-entrypoint-initdb.d/010-trove-timescale.sql:ro
    environment:
      PGDATA: /pgdata
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_USER: ${DATABASE_OPERATOR_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_OPERATOR_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_OPERATOR_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:18-alpine
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8180:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200 OK'
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:f7cbc8bdbbf60a1aaba7d61784a3bdff3ec1e0657f6ad0b26d5b6ab2cd9d0dc6
    command: "server -s3 -dir=/data -master.volumeSizeLimitMB=100 -volume.port=8081 -volume.max=32 -master.telemetry=false"
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333" # S3 API; master and filer stay on the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ || exit 1"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-config-cli:
    image: quay.io/adorsys/keycloak-config-cli:6.5.0-26
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      IMPORT_FILES_LOCATIONS: /config/*
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
      WEB_URL: "http://localhost:3000"
      SERVER_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm.json:/config/realm.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/schmiedmayerlab/trove-server:main
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_HOST: server-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_RESEARCHER_ROLE: ${KEYCLOAK_RESEARCHER_ROLE}
      KEYCLOAK_PARTICIPANT_ROLE: ${KEYCLOAK_PARTICIPANT_ROLE}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    depends_on:
      server-grants:
        condition: service_completed_successfully
      server-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Keycloak passes its health probe before the realm is imported, so wait for the import too.
      keycloak-config-cli:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'

  server-migrate:
    image: ghcr.io/schmiedmayerlab/trove-server:main
    command: ["migrate", "--yes"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_HOST: server-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_OPERATOR_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_OPERATOR_PASSWORD}
    depends_on:
      server-db:
        condition: service_healthy

  server-grants:
    image: timescale/timescaledb:latest-pg18@sha256:9508616d5b941ed931198504c5db3fb47e8f53f790732ea1e889591f1062057c
    entrypoint: ["bash", "/operator/grant-runtime.sh"]
    environment:
      PGHOST: server-db
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME}
      PGUSER: ${DATABASE_OPERATOR_USERNAME}
      PGPASSWORD: ${DATABASE_OPERATOR_PASSWORD}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ../database-operator:/operator:ro
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    image: ghcr.io/schmiedmayerlab/trove-web:main
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700,size=16m
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      VITE_API_BASE_PATH: ${VITE_API_BASE_PATH}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    depends_on:
      - server
    ports:
      - '127.0.0.1:3000:8080'
