apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trove-db
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Stay on 18.6: TimescaleDB 2.32.0 supports PostgreSQL only up to 18.6.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:ec2ed3404e89fff99643901b58a2a34c46a46345fe69a3d96500b82f995c327b
  instances: 1
  storage:
    size: 1Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: trove
      owner: trove
      secret:
        name: trove-postgres-credentials
