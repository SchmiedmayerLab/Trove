apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trove-db
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:5c389b0268d9e637ca55efa41a7fafa3996332b5ea3c6099d0861c5f31acb00e
  instances: 1
  storage:
    size: 1Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: trove
      owner: trove
      secret:
        name: trove-postgres-credentials
