apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trove-db
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2-2-bullseye
  instances: 1
  storage:
    size: 1Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: trove
      owner: trove
      secret:
        name: trove-postgres-credentials
