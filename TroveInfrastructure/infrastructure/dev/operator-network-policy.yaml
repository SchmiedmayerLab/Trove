apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-to-timescale
  namespace: trove
spec:
  podSelector:
    matchLabels:
      app: trove-database-operator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: trove-timescale
      ports:
        - protocol: TCP
          port: 5432
