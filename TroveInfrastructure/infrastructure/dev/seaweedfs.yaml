apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - -s3
            - -dir=/data
            - -master.volumeSizeLimitMB=100
            - -volume.port=8081
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
            - name: filer
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: master
      port: 9333
      targetPort: master
    - name: filer
      port: 8888
      targetPort: filer
