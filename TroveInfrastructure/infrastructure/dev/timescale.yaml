apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trove-timescale
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: trove-timescale
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: trove-timescale
  template:
    metadata:
      labels:
        app: trove-timescale
    spec:
      containers:
        - name: timescale
          image: timescale/timescaledb:latest-pg18@sha256:9508616d5b941ed931198504c5db3fb47e8f53f790732ea1e889591f1062057c
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /pgdata/data
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: POSTGRES_DB
              value: trove
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-credentials
                  key: password
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trove-timescale
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: trove-timescale
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
