apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-timescale
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trove-timescale
  template:
    metadata:
      labels:
        app: trove-timescale
    spec:
      containers:
        - name: timescale
          image: timescale/timescaledb:latest-pg17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: trove
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trove-postgres-credentials
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trove-timescale
  namespace: trove
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: trove-timescale
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
