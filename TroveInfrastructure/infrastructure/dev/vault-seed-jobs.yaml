apiVersion: batch/v1
kind: Job
metadata:
  name: vault-source-identity-keyring-setup
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vault-setup
          image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_TOKEN
              value: dev-only-token
          command:
            - sh
            - -ec
            - |
              umask 077
              until vault status >/dev/null 2>&1; do sleep 2; done
              if vault kv get -field=currentKeyID secret/source-identity-keyring >/dev/null 2>&1; then exit 0; fi
              temporary="$(mktemp)"
              trap 'rm -f "$temporary"' EXIT
              key="$(vault write -field=random_bytes sys/tools/random/32 format=base64)"
              printf '{"version":1,"currentKeyID":"development","keys":[{"id":"development","keyBase64":"%s"}]}' "$key" > "$temporary"
              # Compare-and-set refuses replacement if another initializer already created it.
              vault kv put -cas=0 secret/source-identity-keyring @"$temporary" >/dev/null
