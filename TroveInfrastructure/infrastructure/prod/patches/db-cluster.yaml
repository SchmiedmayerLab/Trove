apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trove-db
  namespace: trove
spec:
  instances: 1
  storage:
    size: 50Gi
  enableSuperuserAccess: false
  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      timescaledb.telemetry_level: "off"
      max_locks_per_transaction: "128"
    extensions:
      - name: timescaledb-oss
        image:
          reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.32.0-18-trixie@sha256:1e80dd1b09b9b81bb63d20d8fb9771e3e4f140f37c25d22af0104f0bdac1e8b1
  bootstrap:
    initdb:
      # Runtime role administration belongs to the schema Job, not two reconcilers.
      postInitApplicationSQL:
        - ALTER ROLE trove CREATEROLE
        - GRANT pg_read_all_settings TO trove
