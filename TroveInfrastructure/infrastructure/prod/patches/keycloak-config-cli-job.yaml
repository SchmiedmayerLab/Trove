apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli
  namespace: trove
spec:
  template:
    metadata:
      labels:
        app: keycloak-config-cli
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak-config-cli
          env:
            - name: KEYCLOAK_URL
              value: https://console.troveplatform.org/auth
            - name: KEYCLOAK_SSLVERIFY
              value: "true"
            - name: WEB_URL
              value: https://console.troveplatform.org
