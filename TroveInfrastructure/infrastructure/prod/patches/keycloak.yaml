apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: trove
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: https://console.troveplatform.org/auth
            - name: KC_HOSTNAME_STRICT
              value: "false"
