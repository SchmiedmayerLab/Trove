apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-main-tls-cert
  namespace: trove
spec:
  commonName: console.troveplatform.org
  secretName: trove-main-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - console.troveplatform.org
