name: trove-benchmark
services:
  benchmark-db:
    image: timescale/timescaledb:2.32.1-pg18@sha256:70e6526ad8e31e3f4833f2c5863b50b92d7a6bee4d432ad1f660e2c6dd956d94
    network_mode: none
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_USER: trove_benchmark
      POSTGRES_PASSWORD: synthetic-benchmark-only
      POSTGRES_DB: trove_benchmark
      PGDATA: /pgdata
    volumes:
      - benchmark_data:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trove_benchmark -d trove_benchmark -t 2"]
      interval: 5s
      timeout: 3s
      retries: 24
volumes:
  benchmark_data:
