services:
  app:
    image: troveserver:latest
    build:
      context: .
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TIMESCALE_HOST: ${TIMESCALE_HOST}
      TIMESCALE_PORT: ${TIMESCALE_PORT}
      TIMESCALE_NAME: ${TIMESCALE_NAME}
      TIMESCALE_USERNAME: ${TIMESCALE_USERNAME}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_RESEARCHER_ROLE: ${KEYCLOAK_RESEARCHER_ROLE}
      KEYCLOAK_PARTICIPANT_ROLE: ${KEYCLOAK_PARTICIPANT_ROLE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    ports:
      - "8080:8080"
    command:
      [
        "serve",
        "--env",
        "production",
        "--hostname",
        "0.0.0.0",
        "--port",
        "8080",
      ]
  migrate:
    image: troveserver:latest
    build:
      context: .
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TIMESCALE_HOST: ${TIMESCALE_HOST}
      TIMESCALE_PORT: ${TIMESCALE_PORT}
      TIMESCALE_NAME: ${TIMESCALE_NAME}
      TIMESCALE_USERNAME: ${TIMESCALE_USERNAME}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
  revert:
    image: troveserver:latest
    build:
      context: .
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TIMESCALE_HOST: ${TIMESCALE_HOST}
      TIMESCALE_PORT: ${TIMESCALE_PORT}
      TIMESCALE_NAME: ${TIMESCALE_NAME}
      TIMESCALE_USERNAME: ${TIMESCALE_USERNAME}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
