listen 8080 ssl;
ssl_certificate /run/secrets/https/tls.crt;
ssl_certificate_key /run/secrets/https/tls.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;

# Never prompt for encrypted keys in an unattended serving process.
ssl_password_file /dev/null;

error_page 497 = @reject_plaintext;
location @reject_plaintext {
    return 444;
}
