server {
    include /var/cache/nginx/transport.conf;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Request URLs may contain authentication codes or participant identifiers.
    # Ingress retains the allowlisted operational fields; startup errors still log.
    access_log off;
    error_log /dev/null;

    # Do not cache index.html or env.js (generated at container startup).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /env.js {
        alias /var/cache/nginx/env.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
