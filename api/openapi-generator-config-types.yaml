generate:
  - types
accessModifier: public
namingStrategy: idiomatic
additionalImports:
  - SpeziLocalization
  - SpeziHealthKit
  - SpeziStudyDefinition
  - SpeziAccount
typeOverrides:
  schemas:
    InformationalContent: StudyPlatformAPITypes.InformationalContent
    InformationalComponentData: SpeziLocalization.LocalizationsDictionary<StudyPlatformAPITypes.InformationalContent>
    QuestionnaireContent: StudyPlatformAPITypes.QuestionnaireContent
    QuestionnaireComponentData: SpeziLocalization.LocalizationsDictionary<StudyPlatformAPITypes.QuestionnaireContent>
    LocalizedString: "SpeziLocalization.LocalizationsDictionary<Swift.String>"
    StudyDetailContent: StudyPlatformAPITypes.StudyDetailContent
    StudyDetailData: "SpeziLocalization.LocalizationsDictionary<StudyPlatformAPITypes.StudyDetailContent>"
    SampleTypesCollection: "[SpeziHealthKit.SampleTypeProxy]"
    LocalizationKey: SpeziLocalization.LocalizationKey
    StudyConsent: "SpeziLocalization.LocalizationsDictionary<StudyPlatformAPITypes.ConsentContent>"
    StudyMetadataCodable: SpeziStudyDefinition.StudyDefinition.Metadata
    StudyVisibility: StudyPlatformAPITypes.StudyVisibility
    EnrollmentConditions: StudyPlatformAPITypes.EnrollmentConditions
    GenderIdentity: SpeziAccount.GenderIdentity
