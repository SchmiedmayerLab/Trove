apiVersion: v1
kind: ConfigMap
metadata:
  name: studyplatform-server-config
  namespace: studyplatform
data:
  DATABASE_HOST: studyplatform-db-rw
  DATABASE_NAME: studyplatform
  KEYCLOAK_URL: http://keycloak.studyplatform.svc.cluster.local/auth
  KEYCLOAK_REALM: studyplatform
  KEYCLOAK_CLIENT_ID: studyplatform-server
  KEYCLOAK_RESEARCHER_ROLE: studyplatform-researcher
  KEYCLOAK_PARTICIPANT_ROLE: studyplatform-participant
  APP_ENVIRONMENT: development
