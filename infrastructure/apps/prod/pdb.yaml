apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studyplatform-server-pdb
  namespace: studyplatform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: studyplatform-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studyplatform-web-pdb
  namespace: studyplatform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: studyplatform-web
