apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studyplatform-db
  namespace: studyplatform
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2-2-bullseye
  instances: 1
  storage:
    size: 1Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: studyplatform
      owner: studyplatform
      secret:
        name: studyplatform-postgres-credentials
