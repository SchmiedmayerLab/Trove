apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studyplatform-main-tls-cert
  namespace: studyplatform
spec:
  commonName: platform.spezi.stanford.edu
  secretName: studyplatform-main-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - platform.spezi.stanford.edu
